name: Circulaires de la semaine

on:
  # Once a week: Thursday noon (Montreal), and only if that failed, a second try at 20 h.
  # GitHub's clock is UTC: both hours are listed (winter / summer time), the "Quand" step keeps the right one.
  schedule:
    - cron: "7 16,17 * * 4"   # Thursday 12 h Montreal
    - cron: "7 0,1 * * 5"     # Thursday 20 h Montreal (Friday in UTC)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Combien de semaines passées aller chercher (Noovo Moi)"
        default: "4"
      force:
        description: "Refaire la semaine même si elle est déjà faite (oui/non)"
        default: "non"

permissions:
  contents: write

concurrency:
  group: circulaires
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Outils (lecture des PDF)
        run: npm install --no-save --no-package-lock pdf-parse@1.1.1
      - name: Reprendre les données des semaines passées
        run: |
          mkdir -p ../d
          if git fetch -q origin data; then git archive origin/data | tar -x -C ../d; fi
          # first run: keep what is already on main
          if [ ! -d ../d/data ] && [ -d data ]; then cp -r data ../d/; fi
      - name: Quand (une seule lecture par semaine)
        id: when
        run: |
          H=$(TZ=America/Toronto date +%H)
          echo "try=$([ "$H" -ge 18 ] && echo soir || echo midi)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "12" ] && [ "$H" != "20" ]; then echo "Pas la bonne heure ($H h)"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          DONE=$(node -e '
            const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Toronto"}));d.setDate(d.getDate()-(d.getDay()+3)%7);
            const wk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
            let r={};try{r=JSON.parse(require("fs").readFileSync("../d/data/regions.json","utf8"))}catch(e){}
            console.log(r.week===wk&&r.complete?"1":"0")')
          # everyday prices (Maxi, Provigo) and Costco: also once a week
          FRESH=$(node -e '
            const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Toronto"}));d.setDate(d.getDate()-(d.getDay()+3)%7);
            const wk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
            const f=(p)=>{try{const j=JSON.parse(require("fs").readFileSync(p,"utf8"));return String(j.date||j.made||"").slice(0,10)>=wk}catch(e){return false}};
            console.log((f("../d/data/reg/latest.json")?"r":"")+(f("../d/data/costco/latest.json")?"c":""))')
          if [ "${{ github.event.inputs.force }}" != "oui" ]; then
            case "$FRESH" in *r*) echo "regdone=1" >> "$GITHUB_OUTPUT";; esac
            case "$FRESH" in *c*) echo "costcodone=1" >> "$GITHUB_OUTPUT";; esac
          fi
          if [ "$DONE" = "1" ] && [ "${{ github.event.inputs.force }}" != "oui" ]; then echo "Circulaires de la semaine déjà téléchargées : on n'y retourne pas"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Lire les circulaires
        if: steps.when.outputs.skip != '1'
        run: node robot/circulaires.mjs --out=../d --backfill=${{ github.event.inputs.backfill || '2' }} ${{ github.event.inputs.force == 'oui' && '--force' || '' }}
      - name: Prix de 2026 (Noovo Moi, sites Maxi et Provigo) - sans IA
        if: steps.when.outputs.skip != '1' && steps.when.outputs.regdone != '1'
        continue-on-error: true
        run: node robot/historique.mjs --out=../d
      - name: Circulaire Costco (costco.ca, rabais et prix en entrepôt)
        if: steps.when.outputs.skip != '1' && steps.when.outputs.costcodone != '1'
        continue-on-error: true
        run: |
          curl -s -L -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" -H "Accept-Language: fr-CA,fr;q=0.9" "https://www.costco.ca/coupons.html?langId=-25" -o /tmp/costco.html || true
          node robot/costco.mjs --out=../d --page=/tmp/costco.html
      - name: Enregistrer (branche data, refaite chaque fois pour rester petite)
        if: always() && steps.when.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ../d
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="panier-fute-robot" -c user.email="robot@users.noreply.github.com" commit -qm "Circulaires $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data
      - name: Résultat (échec = courriel de GitHub; l'app affiche aussi un message)
        if: steps.when.outputs.skip != '1'
        run: |
          OK=$(node -e 'let r={};try{r=JSON.parse(require("fs").readFileSync("../d/data/regions.json","utf8"))}catch(e){}console.log(r.mtl?"1":"0")')
          if [ "$OK" != "1" ]; then
            if [ "${{ steps.when.outputs.try }}" = "soir" ]; then echo "::error::Circulaires de la semaine PAS téléchargées (essais de midi et de 20 h)"; exit 1; fi
            echo "::warning::Circulaires pas téléchargées à midi : nouvel essai à 20 h"
          fi
