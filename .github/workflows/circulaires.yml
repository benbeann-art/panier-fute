name: Circulaires de la semaine

on:
  schedule:
    - cron: "17 10 * * 4"   # Thursday ~5 h (Montreal): new flyers
    - cron: "17 18 * * 4"   # Thursday afternoon: second try
    - cron: "17 11 * * 5"   # Friday: last try
  workflow_dispatch:
    inputs:
      backfill:
        description: "Combien de semaines passées aller chercher (Noovo Moi)"
        default: "52"
      force:
        description: "Refaire la semaine même si elle est déjà faite (oui/non)"
        default: "non"

permissions:
  contents: write

concurrency:
  group: circulaires
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lire les circulaires
        run: node robot/circulaires.mjs --backfill=${{ github.event.inputs.backfill || '4' }} ${{ github.event.inputs.force == 'oui' && '--force' || '' }}
      - name: Enregistrer
        run: |
          git config user.name "panier-fute-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Circulaires $(date -u +%Y-%m-%d)"
          git push
