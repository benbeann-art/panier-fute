<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier futé</title>
<meta name="theme-color" content="#d4241b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: practical, cheerful, like the Thursday flyer on the kitchen table
   IDEA: a grocery flyer + the fridge list — specials as bold price tags with a 1-10 deal score
   PICTURE: the working app itself — price-tag rows, the 7-day grid, the tickable list
   COLOUR and TYPE: flyer red, price-tag yellow, paper white / warm night; Archivo 900 for prices and titles
   LAYOUT: one column on phone, two on computer; bottom tab bar on phone, top on wide screens */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#141210);--paper:light-dark(#f4f1ea,#1f1c19);--ink:light-dark(#151515,#f3efe7);
 --mute:light-dark(#5d5952,#b3ada3);--line:light-dark(#e2ddd3,#34302b);
 --red:light-dark(#d4241b,#ff5a4b);--redbg:light-dark(#d4241b,#c4271e);--yel:#ffd400;--green:light-dark(#2f7d32,#7fcf83)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;background:var(--redbg);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 10px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-weight:600;font-size:13px;opacity:.9;letter-spacing:0}
.sync{margin-left:auto;font-size:13px;opacity:.9;text-align:right}
.gear{border:0;background:rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}.gear svg{width:24px;height:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;min-height:60px;font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--red)}
nav.tabs .n{font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;margin-left:2px}
main{max-width:1180px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.view{display:none}.view.on{display:block}
h1{font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-weight:800;font-size:20px;margin:26px 0 10px;line-height:1.2}
.lead{color:var(--mute);margin:0 0 14px;max-width:68ch}
.btn{border:2px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-width:1.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--paper);border-radius:16px;padding:14px 16px}
.tag{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px 10px 10px 2px;background:var(--yel);color:#151515;font-weight:900;font-size:22px;line-height:1;position:relative;flex:none}
.tag small{font-size:9px;font-weight:700;position:absolute;bottom:3px;right:5px}
.tag.hot{background:var(--red);color:#fff}
.tag.mini{min-width:30px;height:24px;font-size:13px;border-radius:6px 6px 6px 1px}
.price{font-weight:900;font-size:20px;white-space:nowrap}
.mute{color:var(--mute)}.small{font-size:14px}
/* specials */
.spec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.spec .nm{font-weight:700;line-height:1.25}
.spec .meta{font-size:14px;color:var(--mute)}
.spec .go{grid-column:2/4;justify-self:start;border:0;background:none;color:var(--red);font-weight:700;padding:4px 0;font-size:14px;min-height:32px}
.spec .x{border:0;background:none;color:var(--mute);font-size:20px;width:36px;height:36px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.week{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}
.warn{background:light-dark(#fff3c4,#3a3110);border-radius:12px;padding:10px 14px;margin:10px 0}
fieldset{border:0;margin:0;padding:0}
label.f{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
textarea{min-height:110px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--red);flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
details>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* cooking mode */
#cook{position:fixed;inset:0;z-index:65;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#cook.on{display:flex}
#cook .ctop{display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px);background:var(--redbg);color:#fff}
#cook .ctop b{flex:1;font-size:17px;line-height:1.2}#cook .ctop .close{position:static;background:rgba(255,255,255,.2);color:#fff}
#cook .cdots{display:flex;gap:5px;padding:10px max(4vw,14px)}#cook .cdots span{flex:1;height:6px;border-radius:3px;background:var(--line)}
#cook .cdots .past{background:var(--green)}#cook .cdots .on{background:var(--red)}
#cook .cbody{flex:1;overflow:auto;padding:4px max(4vw,14px) 120px;max-width:820px;margin:0 auto;width:100%}
#cook .kicker{font-weight:800;color:var(--red);margin:10px 0 0}
#cook h2{font-size:30px;font-weight:900;margin:4px 0 6px}#cook h3{font-size:19px;margin:18px 0 6px}
#cook .step{font-size:clamp(22px,5.5vw,30px);line-height:1.35;font-weight:600;margin:12px 0 18px}
#cook .chk.big{align-items:flex-start;font-size:18px;padding:6px 0;min-height:44px}#cook .chk.big input{width:28px;height:28px;flex:none;margin-top:2px}
#cook .chk.big input:checked+span{text-decoration:line-through;opacity:.55}
#cook .tbtn.big{font-size:20px;padding:10px 20px;min-height:52px;margin:4px 8px 4px 0}
#cook .cnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#cook .cnav .btn{flex:1;min-height:56px;font-size:17px}
body:has(#cook.on) #timers{bottom:calc(92px + env(safe-area-inset-bottom))}
/* voice + shopping mode + print */
.gear.on{background:#fff;color:var(--red);animation:pulse 1s infinite}
#shop{position:fixed;inset:0;z-index:64;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#shop.on{display:flex}
#shop .ctop{display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px);background:var(--ink);color:var(--bg)}
#shop .ctop b{flex:1;font-size:18px}#shop .ctop .close{position:static;background:rgba(255,255,255,.2);color:var(--bg)}
#shop .cbody{flex:1;overflow:auto;padding:0 max(4vw,14px) 40px;max-width:820px;margin:0 auto;width:100%}
#shop h3{font-size:16px;color:var(--mute);margin:18px 0 4px}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;min-height:64px;font-size:20px}
.srow b{font-weight:700}.srow .q{display:block;font-size:16px;color:var(--mute)}
.srow .bx{width:32px;height:32px;border:3px solid var(--mute);border-radius:8px;display:grid;place-items:center;font-size:18px}
.srow.done{opacity:.5}.srow.done b{text-decoration:line-through}.srow.done .bx{background:var(--green);border-color:var(--green);color:#fff}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;font:14pt/1.5 Archivo,system-ui,sans-serif;white-space:pre-wrap;color:#000}}
/* monthly summary */
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}.bar .track span{display:block;height:100%;background:var(--red);border-radius:7px}
.bar b{text-align:right;white-space:nowrap}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mcol b{font-size:12px;white-space:nowrap}
.mbar{width:70%;max-width:44px;background:var(--red);border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:2px}
.msave{display:block;width:100%;background:var(--green)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}.lg.dep{background:var(--red)}.lg.sav{background:var(--green)}
/* cooking timers */
.tbtn{display:inline-flex;align-items:center;margin:6px 0 0 6px;border:2px solid var(--red);color:var(--red);background:var(--bg);border-radius:999px;padding:4px 12px;min-height:36px;font-weight:800;font-size:14px}
#timers{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
#timers[hidden]{display:none}
.tm{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tm .tl{flex:1;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm b{font-size:24px;font-variant-numeric:tabular-nums}
.tm .btn{border-color:var(--bg);background:transparent;color:var(--bg)}
.tm.done{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
@media(min-width:900px){#timers{bottom:16px}}
.vrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}
.vrow>div:first-child{flex:1;min-width:200px}.vrow .q{display:block;font-size:14px;color:var(--mute)}
/* hand-added items */
.sug{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:start;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0;min-height:44px}
.sug span:first-child{font-weight:700}
.xrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.xrow>span:first-child{flex:1;min-width:140px;font-weight:600}
.xrow .qty{display:flex;align-items:center;gap:8px}.xrow .qty .btn{min-height:36px;min-width:36px;padding:0}
.xprice{width:90px!important;min-height:36px!important;display:inline-block}
.xrow .x{border:0;background:none;color:var(--mute);font-size:22px;width:36px;height:36px}
/* flyer */
.flyer{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.art{position:relative;display:flex;flex-direction:column;text-align:start;background:#fff;color:#151515;border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;min-height:44px}
.art .ph img,.art .ph-empty{aspect-ratio:4/3}
.ph-empty{display:grid;place-items:center;background:#fff6cc;padding:8px;text-align:center;font-weight:800;font-size:14px;color:#6d5800}
.art .tag{position:absolute;top:6px;left:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.art .ok{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px}
.art.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}
.art .body{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px}
.art .nm{font-weight:700;font-size:14px;line-height:1.25}
.art .price{font-weight:900;font-size:20px;color:#d4241b}
.art .meta{font-size:12px;color:#5d5952}
.selbar{position:sticky;top:64px;z-index:15;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:12px;margin:0 0 10px}
.selbar span{flex:1}.selbar .btn{border-color:var(--bg);background:transparent;color:var(--bg)}.selbar .btn.red{background:var(--red);border-color:var(--red);color:#fff}
/* menu */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.day{background:var(--paper);border-radius:14px;padding:10px 12px}
.day h3{margin:0 0 6px;font-size:17px;font-weight:900}
.meal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);width:100%;text-align:start;background:none;border-left:0;border-right:0;border-bottom:0;min-height:48px}
.meal b{font-size:13px;color:var(--mute);font-weight:700;padding-top:2px}
.meal span{font-weight:600;line-height:1.3}
.meal i{display:block;font-style:normal;font-size:12px;color:var(--mute);font-weight:500}
.meal.empty span{color:var(--mute);font-weight:500}
.cook{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.cook .nm{font-weight:700;border:0;background:none;padding:0;text-align:start}
/* list */
.store{margin-top:18px}
.store>h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0;padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:12px 12px 0 0;font-size:18px;font-weight:900}
.aisle{font-size:13px;font-weight:700;color:var(--mute);padding:10px 2px 2px;text-transform:none}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;min-height:52px}
.item .bx{width:24px;height:24px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center}
.item .q{display:block;font-size:14px;color:var(--mute)}
.item .p{text-align:right;font-weight:700;white-space:nowrap;font-size:15px}
.item.done{opacity:.55}.item.done .nm{text-decoration:line-through}
.item.done .bx{background:var(--green);border-color:var(--green);color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{background:var(--paper);border-radius:14px;padding:10px 12px}
.sum b{display:block;font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.1}
/* recipes */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:12px}
.rec{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rec .pic{display:block;border:0;padding:0;margin:-12px -14px 4px;background:none;border-radius:14px 14px 0 0;overflow:hidden}
.rec .pic svg,.hero svg,.thumb svg{display:block;width:100%;height:auto}
.ph{position:relative}.ph img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;background:var(--paper)}
.ph .cred{position:absolute;right:6px;bottom:6px;max-width:80%;font-size:10px;line-height:1.3;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin:0 0 10px;border-radius:14px;overflow:hidden;max-width:520px}
.cook .thumb{width:84px;border:0;padding:0;border-radius:10px;overflow:hidden;background:none}
.rec .nm{font-weight:800;font-size:17px;line-height:1.25;background:none;border:0;padding:0;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.sp{background:var(--yel);border-color:var(--yel);color:#151515}
.rec .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.save{font-weight:900;color:var(--green)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.45)}
.sheet.on{display:block}
.sheet .in{position:absolute;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(4vw,16px) calc(24px + env(safe-area-inset-bottom))}
@media(min-width:900px){.sheet .in{inset:4vh auto 4vh 50%;transform:translateX(-50%);width:min(760px,94vw);border-radius:20px;max-height:none}}
.sheet h2{font-size:clamp(24px,5vw,32px);font-weight:900;margin:6px 0 8px;line-height:1.1}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ings .q{font-weight:700;white-space:nowrap;text-align:right}
ol.steps{padding-left:22px}ol.steps li{margin:0 0 10px}
.close{position:sticky;top:0;float:right;border:0;background:var(--paper);border-radius:50%;width:44px;height:44px;font-size:22px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;display:none;max-width:90vw}
.empty{padding:24px;text-align:center;background:var(--paper);border-radius:16px}
@media(min-width:900px){body{padding-bottom:0}nav.tabs{position:sticky;top:64px;bottom:auto;max-width:1180px;margin:0 auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(5,max-content);gap:6px;padding:0 max(4vw,14px)}
 nav.tabs button{flex-direction:row;min-height:52px;font-size:15px;padding:0 14px;gap:8px}nav.tabs button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--red)}.toast{bottom:24px}}
@media(max-width:760px){.split{grid-template-columns:minmax(0,1fr)}.sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sum div:first-child{grid-column:1/3}}
@media(prefers-reduced-motion:no-preference){.item,.meal{transition:opacity .2s}.sheet .in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}@media(min-width:900px){.sheet .in{animation:none}}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Panier futé<small>Spéciaux → recettes</small></div>

 et riz","l":"micro","p":"porc_filet","t":40,"k":"saute","i":[["porc_filet",2000],["riz",900],["brocoli",2],["poivron",3],["carotte",400],["oignon",2],["ail",4],["gingembre",30],["sauce_soya",8],["miel",3],["fecule",3],["huile",4],["bouillon_poulet",500],["huile_sesame",1],["sel",0.5],["poivre",1]],"s":["Cuire le riz selon le format (environ 18 min).","Couper la viande (filet de porc) en lanières ou en cubes et la dorer à feu vif en 2 ou 3 fois, jusqu'à cuisson complète (71 °C à cœur).","Dans la même poêle, sauter les légumes coupés (oignon, carotte, poivron, brocoli) 5 à 6 min, ils doivent rester croquants.","Mélanger le bouillon, la sauce soya, le miel, l'ail et le gingembre râpés et la fécule. Verser dans la poêle et amener à ébullition jusqu'à ce que la sauce épaississe.","Remettre la protéine, mélanger, ajouter l'huile de sésame. Servir sur le riz."]},{"id":"005-saut-de-crevettes-et-lgumes-sauce-soya-gingembre","n":"Sauté de crevettes et légumes, sauce soya-gingembre","c":"Sautés et riz","l":"micro","p":"crevettes","t":40,"k":"saute","i":[["crevettes",1800],["riz",900],["brocoli",2],["poivron",3],["carotte",400],["oignon",2],["ail",4],["gingembre",30],["sauce_soya",8],["miel",3],["fecule",3],["huile",4],["bouillon_poulet",500],["huile_sesame",1],["sel",0.5],["poivre",1]],"s":["Cuire le riz selon le format (environ 18 min).","Cuire les crevettes 2 à 3 min, juste jusqu'à ce qu'elles soient roses, puis réserver.","Dans la même poêle, sauter les légumes coupés (oignon, carotte, poivron, brocoli) 5 à 6 min, ils doivent rester croquants.","Mélanger le bouillon, la sauce soya, le miel, l'ail et le gingembre râpés et la fécule. Verser dans la poêle et amener à ébullition jusqu'à ce que la sauce épaississe.","Remettre la protéine, mélanger, ajouter l'huile de sésame. Servir sur le riz."]},{"id":"006-saut-de-tofu-et-lgumes-sauce-soya-gingembre","n":"Sauté de tofu et légumes, sauce soya-gingembre","c":"Sautés et riz","l":"micro","p":"tofu","t":40,"k":"saute","i":[["tofu",  la viande (filet de porc) en lanières ou en cubes et la dorer à feu vif en 2 ou 3 fois, jusqu'à cuisson complète (71 °C à cœur).","Faire revenir l'oignon haché 5 min, ajouter l'ail, le gingembre et les épices 1 min.","Ajouter les tomates et le lait de coco, mijoter 15 min.","Remettre la protéine, ajouter les épinards et mijoter 5 min (jusqu'à cuisson complète). Assaisonner, finir avec le jus de lime et la coriandre."]},{"id":"014-poulet-au-beurre-butter-chicken","n":"Poulet au beurre (butter chicken)","c":"Caris et mijotés","l":"micro","p":"poulet_poitrine","t":50,"k":"beurre_ch","i":[["poulet_poitrine",2000],["riz_basmati",900],["sauce_tomate",680],["creme",500],["beurre",60],["oignon",2],["ail",5],["gingembre",25],["garam",4],["cumin",2],["paprika",2],["cassonade",1],["sel",2],["yogourt",250],["coriandre",1]],"s":["Mélanger la protéine avec le yogourt, la moitié des épices et 1 c. à thé de sel. Laisser reposer 20 min si possible.","Cuire le riz basmati.","Fondre le beurre, cuire l'oignon 5 min, ajouter l'ail, le gingembre et le reste des épices 1 min.","Ajouter la sauce tomate et la cassonade, mijoter 10 min. Ajouter la protéine et cuire jusqu'à cuisson complète (poulet 74 °C).","Ajouter la crème, chauffer 3 min sans bouillir. Garnir de coriandre."]},{"id":"016-crevettes-au-beurre-butter-chicken","n":"Crevettes au beurre (butter chicken)","c":"Caris et mijotés","l":"micro","p":"crevettes","t":50,"k":"beurre_ch","i":[["crevettes",1800],["riz_basmati",900],["sauce_tomate",680],["creme",500],["beurre",60],["oignon",2],["ail",5],["gingembre",25],["garam",4],["cumin",2],["paprika",2],["cassonade",1],["sel",2],["yogourt",250],["coriandre",1]],"s":["Mélanger la protéine avec le yogourt, la moitié des épices et 1 c. à thé de sel. Laisser reposer 20 min si possible.","Cuire le riz basmati.","Fondre le beurre, cuire l'oignon 5 min, ajouter l'ail, le gingembre et le reste des épices 1 min.","Ajouter la sauce tomate et la cassonade, mijoter 10 min. Ajouter la protéine et cuire jusqu'à cuisson complète (poulet 74 °C).","Ajouter la crème, chauffer 3 min sans bouillir. Garnir de coriandre."]},{"id":"017-pois-chiches-au-beurre-butter-chicken","n":"Pois chiches au beurre (butter chicken)","c":"Caris et mijotés","l":"micro","p":"pois_chiches","t":50,"k":"beurre_ch","i":[["pois_chiches",4],["riz_basmati",900],["sauce_tomate",680],["creme",500],["beurre",60],["oignon",2],["ail",5],["gingembre",25],["garam",4],["cumin",2],["paprika",2],["cassonade",1],["sel",2],["yogourt",250],["coriandre",1]],"s":["Mélanger la protéine avec le yogourt, la moitié des épices et 1 c. à thé de sel. Laisser reposer 20 min si possible.","Cuire le riz basmati.","Fondre le beurre, cuire l'oignon 5 min, ajouter l'ail, le gingembre et le reste des épices 1 min.","Ajouter la sauce tomate et la cassonade, mijoter 10 min. Ajouter la protéine et cuire jusqu'à cuisson complète (poulet 74 °C).","Ajouter la crème, chauffer 3 min sans bouillir. Garnir de coriandre."]},{"id":"018-chili-de-buf-hach","n":"Chili de bœuf haché","c":"Soupes et chilis","l":"thermos","p":"boeuf_hache","t":50,"k":"chili","i":[["boeuf_hache",2000],["haricots_rouges",2],["haricots_noirs",2],["tomates_des",2],["sauce_tomate",680],["oignon",3],["poivron",3],["ail",4],["mais",500],["chili_poudre",6],["cumin",3],["paprika",2],["origan",1],["sel",2],["huile",2],["creme_sure",250],["cheddar",300]],"s":["Dorer le bœuf haché en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 71 °C). Retirer l'excédent de gras.","Ajouter l'oignon, le poivron et l'ail hachés, cuire 5 min. Ajouter les épices 1 min.","Ajouter les tomates, la sauce, les haricots rincés et le maïs. Mijoter à couvert 30 min en brassant de temps en temps.","Assaisonner. Servir avec crème sure et cheddar râpé. Pour le lunch : bien chaud dans le thermos, fromage à part."]},{"id":"019-chili-de-dinde-hache","n":"Chili de dinde hachée","c":"Soupes et chilis","l":"thermos","p":"dinde_hachee","t":50,"k":"chili","i":[["dinde_hach it chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"092-pt-chinois-la-dinde-hache","n":"Pâté chinois à la dinde hachée","c":"Au four","l":"micro","p":"dinde_hachee","t":70,"k":"pate_chinois","i":[["dinde_hachee",2000],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Dorer le dinde hachée en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 74 °C). Retirer l'excédent de gras. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"093-pt-chinois-aux-lentilles","n":"Pâté chinois aux lentilles","c":"Au four","l":"micro","p":"lentilles","t":70,"k":"pate_chinois","i":[["lentilles",4],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Ajouter les lentilles rincées et égouttées. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"094-bols-burrito-de-buf-hach","n":"Bols burrito de bœuf haché","c":"Mexicain","l":"micro","p":"boeuf_hache","t":40,"k":"bols_burrito","i":[["boeuf_hache",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Dorer le bœuf haché en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 71 °C). Retirer l'excédent de gras. Assaisonner avec le chili, le cumin et l'ail en poudre.","Sauter oignon et poivron 5 min, ajouter haricots rincés et maïs, chauffer.","Monter les bols : riz, protéine, légumes, salsa, fromage. Laitue et crème sure dans un petit pot à part pour le lunch."]},{"id":"095-bols-burrito-de-poulet","n":"Bols burrito de poulet","c":"Mexicain","l":"micro","p":"poulet_poitrine","t":40,"k":"bols_burrito","i":[["poulet_poitrine",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Couper la viande (poitrines de poulet désossées) en cubes de 2 cm et la dorer à feu vif en 2 ou 3 fois, jusqu'à cuisson complète (74 °C à cœur). Assaisonner avec le chili, le cumin et l'ail en poudre.","Sauter oignon et poivron 5 min, ajouter haricots rincés et maïs, chauffer.","Monter les bols : riz, protéine, légumes, salsa, fromage. Laitue et crème sure dans un petit pot à part pour le lunch."]},{"id":"096-bols-burrito-de-hauts-de-cuisse-de-poulet","n":"Bols burrito de hauts de cuisse de poulet","c":"Mexicain","l":"micro","p":"poulet_cuisse","t":40,"k":"bols_burrito","i":[["poulet_cuisse",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Couper la viande (hauts de cuisse de       case "flake": return `<g ${t}><path d="M${-s} 0l${s * .6} ${-s * .7}l${s} ${s * .2}l${s * .3} ${s * .7}l${-s} ${s * .4}z" fill="${c1}"/></g>`;
      case "bacon": return `<g ${t}><path d="M${-s * 2} 0q${s} ${-s * .8} ${s * 2} 0t${s * 2} 0" stroke="${c1}" stroke-width="${s * .9}" fill="none" stroke-linecap="round"/><path d="M${-s * 1.8} 0q${s} ${-s * .8} ${s * 2} 0t${s * 1.8} 0" stroke="${c2}" stroke-width="${s * .25}" fill="none"/></g>`;
      case "drum": return `<g ${t}><path d="M${-s * 2.2} ${-s}c${s * 1.6} ${-s * .6} ${s * 2.6} ${s * .2} ${s * 1.8} ${s * 1.6}c${-s * .8} ${s * .8} ${-s * 2.2} ${s * .2} ${-s * 1.8} ${-s * 1.6}z" fill="${c1}"/><path d="M${s * .3} ${s * .4}l${s * 1.4} ${s * .5}" stroke="#f3ead8" stroke-width="${s * .5}" stroke-linecap="round"/><circle cx="${s * 1.8}" cy="${s * .95}" r="${s * .35}" fill="#f3ead8"/><path d="M${-s * 1.5} ${-s * .9}q${s} ${-s * .2} ${s * 1.4} ${s * .5}" stroke="${c2}" stroke-width="1.5" fill="none" opacity=".6"/></g>`;
      case "chop": return `<g ${t}><path d="M${-s * 2} ${-s * .6}c${s} ${-s * 1.2} ${s * 3.4} ${-s} ${s * 3.6} ${s * .2}c0 ${s} ${-s * 2.6} ${s * 1.4} ${-s * 3.6} ${s * .6}z" fill="${c1}" stroke="${c2}" stroke-width="2"/>${[-1, 0, 1].map((k) => `<path d="M${s * k - s * .4} ${-s * .6}l${s * .8} ${s * 1.1}" stroke="${c2}" stroke-width="2" opacity=".55"/>`).join("")}</g>`;
      case "rib": return `<g ${t}><rect x="${-s * 3}" y="${-s * 1.1}" width="${s * 6}" height="${s * 2.2}" rx="${s * .9}" fill="${c1}"/>${[-2, -1, 0, 1, 2].map((k) => `<path d="M${s * k} ${-s * 1.1}v${s * 2.2}" stroke="${c2}" stroke-width="2"/>`).join("")}<path d="M${-s * 2.6} ${-s * .5}h${s * 5.2}" stroke="#fff" opacity=".15" stroke-width="${s * .4}"/></g>`;
      case "whole": return `<g ${t}><ellipse rx="${s * 3}" ry="${s * 2.2}" fill="${c1}"/><ellipse cx="${-s * .6}" cy="${-s * .7}" rx="${s * 1.6}" ry="${s * .9}" fill="#fff" opacity=".18"/><path d="M${s * 2.2} ${-s * 1.4}l${s * 1.6} ${-s * .8}M${s * 2.2} ${s * 1.4}l${s * 1.6} ${s * .8}" stroke="${c1}" stroke-width="${s * 1.1}" stroke-linecap="round"/><path d="M${-s * 2} 0q${s * 2} ${s * .6} ${s * 4} 0" stroke="${c2}" stroke-width="1.5" fill="none"/></g>`;
    }
    return "";
  }

  // vegetables present in the recipe
  function vegList(r) {
    const v = [];
    if (has(r, "brocoli")) v.push(["floret", "#3f8a2e", "#2a6a1e"]);
    if (has(r, "carotte")) v.push(["coin", "#f08a24", "#d06a10"]);
    if (has(r, "poivron")) v.push(["pstrip", "#d8322a", "#f2b632"]);
    if (has(r, "tomate_cerise") || has(r, "tomate")) v.push(["tomato", "#e0352b", "#f6a28f"]);
    if (has(r, "epinards") || has(r, "laitue")) v.push(["leaf", "#3d7a2a", "#2b5c1d"]);
    if (has(r, "mais") || has(r, "mais_conserve")) v.push(["dot", "#f4c430", "#e0a810"]);
    if (has(r, "petits_pois") || has(r, "legumes_mel")) v.push(["dot", "#6fae3c", "#4f8c26"]);
    if (has(r, "champignons")) v.push(["mush", "#c8a57c", "#8f6c48"]);
    if (has(r, "courgette") || has(r, "concombre")) v.push(["coin", "#a9cf6e", "#3d6b22"]);
    if (has(r, "patate_douce")) v.push(["potato", "#ec8a3a", "#c56a20"]);
    if (has(r, "pois_mange_tout")) v.push(["pod", "#5aa232", "#3f7e20"]);
    if (has(r, "ananas")) v.push(["potato", "#f6d14a", "#e0b020"]);
    if (has(r, "olives")) v.push(["olive", "#2c2a26", "#5a5650"]);
    if (has(r, "feves_germees")) v.push(["sprout", "#f3ecd6", "#d8cc9a"]);
    if (has(r, "avocat")) v.push(["coin", "#9cc56a", "#5d8a2c"]);
    return v;
  }
  function veg(kind, x, y, s, c1, c2, rot) {
    const t = `transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})"`;
    switch (kind) {
      case "floret": return `<g ${t}><path d="M0 0v${s * 1.2}" stroke="#7fb24a" stroke-width="${s * .5}" stroke-linecap="round"/><circle cx="${-s * .5}" r="${s * .6}" fill="${c1}"/><circle cx="${s * .5}" r="${s * .6}" fill="${c1}"/><circle cy="${-s * .5}" r="${s * .65}" fill="${c2}"/></g>`;
      case "coin": return `<g ${t}><circle r="${s * .8}" fill="${c1}"/><circle r="${s * .55}" fill="none" stroke="${c2}" stroke-width="1" opacity=".6"/></g>`;
      case "pstrip": return `<g ${t}><path d="M${-s * 1.2} 0q${s * 1.2} ${-s * .7} ${s * 2.4} 0" stroke="${c1}" stroke-width="${s * .55}" fill="none" stroke-linecap="round"/></g>`;
      case "tomato": return `<g ${t}><circle r="${s * .85}" fill="${c1}"/><circle r="${s * .45}" fill="${c2}" opacity=".7"/><circle cx="${-s * .3}" cy="${-s * .35}" r="${s * .18}" fill="#fff" opacity=".5"/></g>`;
      case "leaf": return `<g ${t}><path d="M${-s * 1.2} 0q${s * 1.2} ${-s * 1.2} ${s * 2.4} 0q${-s * 1.2} ${s * 1.2} ${-s * 2.4} 0" fill="${c1}"/><path d="M${-s} 0h${s * 2}" stroke="${c2}" stroke-width="1"/></g>`;
      case "dot": return `<g ${t}><circle r="${s * .38}" fill="${c1}"/><circle cx="${s * .7}" cy="${s * .2}" r="${s * .34}" fill="${c2}"/></g>`;
      case "mush": return `<g ${t}><path d="M${-s} 0a${s} ${s * .8} 0 0 1 ${s * 2} 0z" fill="${c1}"/><rect x="${-s * .25}" y="0" width="${s * .5}" height="${s * .6}" fill="#efe2c8"/></g>`;
      case "potato": return `<g ${t}><rect x="${-s * .7}" y="${-s * .6}" width="${s * 1.4}" height="${s * 1.2}" rx="${s * .3}" fill="${c1}"/><rect x="${-s * .4}" y="${-s * .4}" width="${s * .5}" height="${s * .3}" rx=".2" fill="#fff" opacity=".3"/></g>`;
      case "pod": return `<g ${t}><path d="M${-s * 1.4} 0q${s * 1.4} ${-s * .9} ${s * 2.8} 0q${-s * 1.4} ${s * .6} ${-s * 2.8} 0" fill="${c1}" stroke="${c2}"/></g>`;
      case "olive": return `<g ${t}><circle r="${s * .55}" fill="none" stroke="${c1}" stroke-width="${s * .35}"/></g>`;
      case "sprout": return `<g ${t}><path d="M${-s * 1.3} 0q${s * 1.3} ${s * .4} ${s * 2.6} ${-s * .3}" stroke="${c1}" stroke-width="${s * .3}" fill="none" stroke-linecap="round"/><circle cx="${s * 1.3}" cy="${-s * .3}" r="${s * .3}" fill="#e2d48a"/></g>`;
    }
    return "";
  }

  // base layer inside a region (cx, cy, rx, ry)
  function base(r, R, cx, cy, rx, ry) {
    const out = [];
    const scatter = (n, f) => { for (let i = 0; i < n; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .92; out.push(f(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, R() * 360)); } };
    if (has(r, "spaghetti") || has(r, "nouilles_oeufs") || has(r, "nouilles_lomein") || has(r, "nouilles_riz")) {
      const col = has(r, "nouilles_riz") ? "#f4ead2" : "#f0c766";
      for (let i = 0; i < 16; i++) { const y = cy - ry * .8 + (ry * 1.6 * i) / 15, w = rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2)) * .95;
        out.push(`<path d="M${cx - w} ${y.toFixed(1)}q${w * .5} ${(R() * 10 - 5).toFixed(1)} ${w} 0t${w} 0" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`); }
    } else if (has(r, "pates") || has(r, "macaroni")) {
      scatter(34, (x, y, a) => `<rect x="${(x - 5).toFixed(1)}" y="${(y - 2.2).toFixed(1)}" width="10" height="4.4" rx="2" fill="#f2c25a" stroke="#d9a33a" stroke-width=".8" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
    } else if (has(r, "riz") || has(r, "riz_basmati")) {
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#f7f2e4"/>`);
      scatter(60, (x, y, a) => `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2.2" ry=".9" fill="#e6dcc2" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
    } else if (has(r, "couscous") || has(r, "quinoa")) {
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#e9cf92"/>`);
      scatter(70, (x, y) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1" fill="#d4b26a"/>`);
    } else if (has(r, "patate")) {
      if (r.k === "roti" || r.k === "plaque") scatter(10, (x, y, a) => veg("potato", x, y, 6.5, "#e9b955", "", a));
      else out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#f3e3b5"/><path d="M${cx - rx * .6} ${cy}q${rx * .3} -8 ${rx * .6} 0t${rx * .6} 0" stroke="#e2cd8e" stroke-width="2" fill="none"/>`);
    }
    return out.join("");
  }

  function fill(r, R, cx, cy, rx, ry, opt = {}) {
    let s = "";
    const sauce = SAUCE[r.k];
    if (opt.full && sauce) s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${sauce}"/>`;
    s += opt.noBase ? "" : base(r, R, cx, cy, rx, ry);
    if (!opt.full && sauce && !opt.noSauce) s += `<path d="M${cx - rx * .5} ${cy - ry * .2}c${rx * .3} ${-ry * .5} ${rx * .8} ${-ry * .4} ${rx * .9} ${ry * .1}c${rx * .05} ${ry * .5} ${-rx * .7} ${ry * .7} ${-rx * .9} ${ry * .25}z" fill="${sauce}" opacity=".88"/>`;
    let pr = PROT[r.p];
    if (pr && (r.k === "boulettes" || r.k === "ragout_boulettes" || /boulettes/i.test(r.n))) pr = ["ball", pr[1], pr[2]];
    if (pr && (r.k === "pain_viande" || (r.k === "roti" && r.p === "porc_filet"))) pr = ["slice", pr[1], pr[2]];
    const items = [];
    if (pr) {
      const [k, c1, c2] = pr;
      const big = { whole: 1, rib: 3, chop: 4, fillet: 3, drum: 5 }[k];
      const n = big || (k === "ball" ? 7 : 0) || (k === "crumb" || k === "tiny" || k === "pea" || k === "bean" ? 26 : 11);
      const sz = big ? (k === "whole" ? Math.min(rx, ry) * .32 : k === "rib" ? 7 : 8) : k === "ball" ? 9 : k === "slice" ? 9 : k === "crumb" ? 5.5 : k === "tiny" ? 4.6 : k === "pea" || k === "bean" ? 7 : 6.5;
      for (let i = 0; i < n; i++) {
        const a = R() * 6.283, d = big === 1 ? 0 : Math.sqrt(R()) * (big ? .55 : .7);
        let x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
        if (big && big > 1) { x = cx - rx * .55 + (rx * 1.1 * (i + .5)) / n; y = cy + (R() - .5) * ry * .5; }
        items.push(shape(k, x, y, sz, c1, c2, big ? (R() - .5) * 40 : R() * 360, R));
      }
    }
    for (const [k, c1, c2] of vegList(r).slice(0, 4)) {
      const n = k === "dot" ? 8 : 4;
      for (let i = 0; i < n; i++) { const a = R() * 6.283, d = .25 + Math.sqrt(R()) * .62; items.push(veg(k, cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, 5.5, c1, c2, R() * 360)); }
    }
    // shuffle so meat and vegetables mix
    for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
    s += items.join("");
    if (opt.cheese) for (let i = 0; i < 14; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .85; s += `<ellipse cx="${(cx + Math.cos(a) * rx * d).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * d).toFixed(1)}" rx="${(6 + R() * 6).toFixed(1)}" ry="${(4 + R() * 4).toFixed(1)}" fill="${opt.cheese}" opacity=".85"/>`; }
    if (has(r, "coriandre") || has(r, "persil") || has(r, "oignon_vert")) for (let i = 0; i < 12; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .8; s += `<circle cx="${(cx + Math.cos(a) * rx * d).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * d).toFixed(1)}" r="1.6" fill="#3c8a2e"/>`; }
    if (has(r, "parmesan") && !opt.cheese) for (let i = 0; i < 18; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .8; s += `<rect x="${(cx + Math.cos(a) * rx * d).toFixed(1)}" y="${(cy + Math.sin(a) * ry * d).toFixed(1)}" width="2.4" height="1.2" fill="#fff8e0"/>`; }
    return s;
  }

  const BG = { "Sandwichs": "#f7e3c8", "Pâtes": "#f3d9cf", "Sautés et riz": "#e5ead3", "Au four": "#f0dcc4", "Soupes et chilis": "#efd6c7", "Mexicain": "#f6dfb6",
    "Caris et mijotés": "#f3dcb8", "Salades-repas": "#dcebd2", "Œufs": "#f6e8bc", "Poisson": "#d8e6ea" };

  function sandwich(r, R) {
    const bread = ["pain_tranche", "kaiser", "baguette", "tortilla", "pita", "croissant", "ciabatta", "bagel", "pain_sousmarin"].find((b) => has(r, b)) || "pain_tranche";
    const pr = PROT[r.p] || ["slice", "#e8bd85", "#c98f55"];
    const layers = [];
    if (has(r, "laitue") || has(r, "epinards")) layers.push(["wave", "#5fa034"]);
    if (has(r, "tomate")) layers.push(["band", "#e0352b"]);
    if (has(r, "fromage_tranche") || has(r, "cheddar") || has(r, "mozzarella")) layers.push(["band", "#f6c33a"]);
    if (has(r, "chou") || has(r, "carotte")) layers.push(["wave", "#f0d9a8"]);
    layers.push(["prot", pr[1]]);
    const cx = W / 2, cy = H / 2 + 6;
    let s = `<ellipse cx="${cx}" cy="${H - 18}" rx="98" ry="10" fill="#000" opacity=".08"/>`;
    const stack = (x, w, top, bot, round) => {
      let g = "", y = cy - 2;
      g += bot;
      for (const [k, c] of layers.slice().reverse()) {
        if (k === "wave") g += `<path d="M${x - w / 2 - 4} ${y}q6 -7 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" clip-path="url(#cl${round})"/>`;
        else if (k === "band") g += `<rect x="${x - w / 2 + 2}" y="${y - 5}" width="${w - 4}" height="7" rx="3" fill="${c}"/>`;
        else g += `<rect x="${x - w / 2 - 2}" y="${y - 9}" width="${w + 4}" height="11" rx="5" fill="${c}"/><path d="M${x - w / 2} ${y - 4}h${w}" stroke="${pr[2]}" stroke-dasharray="6 5" stroke-width="2" opacity=".6"/>`;
        y -= 8;
      }
      return g + top(y);
    };
    if (bread === "tortilla") {
      for (const [x, y] of [[cx - 42, cy], [cx + 42, cy]]) {
        s += `<circle cx="${x}" cy="${y}" r="38" fill="#f1dcae" stroke="#d9b779" stroke-width="3"/>`;
        let rr = 32; for (const [k, c] of layers.concat(layers)) { s += `<circle cx="${x}" cy="${y}" r="${rr}" fill="none" stroke="${c}" stroke-width="5"/>`; rr -= 6; if (rr < 6) break; }
        s += `<circle cx="${x}" cy="${y}" r="5" fill="#f1dcae"/>`;
      }
      return s;
    }
    if (bread === "pita") {
      s += `<path d="M${cx - 70} ${cy + 26}a70 64 0 0 1 140 0z" fill="#f0d39a" stroke="#d1aa62" stroke-width="3"/>`;
      layers.forEach(([k, c], i) => { s += `<path d="M${cx - 60 + i * 6} ${cy + 26 - i * 1}q${60 - i * 6} ${-30 + i * 4} ${120 - i * 12} 0" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`; });
      s += `<path d="M${cx - 70} ${cy + 26}h140" stroke="#c99a52" stroke-width="5" stroke-linecap="round"/>`;
      return s;
    }
    const spec = {
      pain_tranche: { w: 130, col: "#d8a868", crumb: "#f6e7c8", sq: true }, kaiser: { w: 120, col: "#c98c43", crumb: "#f4dfb4" },
      baguette: { w: 190, col: "#d0954a", crumb: "#f4dfb4", long: true }, croissant: { w: 150, col: "#d99a42", crumb: "#f2d48e", cr: true },
      ciabatta: { w: 150, col: "#d8b783", crumb: "#f3e5c8", sq: true }, bagel: { w: 120, col: "#c98a40", crumb: "#efd7a8", bg: true },
      pain_sousmarin: { w: 190, col: "#d9a45c", crumb: "#f5e3bd", long: true },
    }[bread];
    const w = spec.w, x0 = cx - w / 2;
    s += `<defs><clipPath id="cl1"><rect x="${x0}" y="0" width="${w}" height="${H}"/></clipPath></defs>`;
    const bot = `<rect x="${x0}" y="${cy - 2}" width="${w}" height="${spec.sq ? 18 : 16}" rx="${spec.sq ? 5 : 9}" fill="${spec.crumb}" stroke="${spec.col}" stroke-width="4"/>`;
    const top = (y) => spec.sq
      ? `<rect x="${x0}" y="${y - 20}" width="${w}" height="20" rx="6" fill="${spec.crumb}" stroke="${spec.col}" stroke-width="4"/>`
      : spec.cr
        ? `<path d="M${x0} ${y}c10 -40 ${w - 20} -40 ${w} 0z" fill="${spec.col}"/>${[1, 2, 3, 4].map((k) => `<path d="M${x0 + (w * k) / 5} ${y}q-6 -16 4 -30" stroke="#b97a2a" stroke-width="2" fill="none"/>`).join("")}`
        : `<path d="M${x0} ${y}c${spec.long ? 6 : 4} ${spec.long ? -26 : -40} ${w - 8} ${spec.long ? -26 : -40} ${w} 0z" fill="${spec.col}"/>${spec.long ? [1, 2, 3, 4].map((k) => `<path d="M${x0 + (w * k) / 5 - 8} ${y - 18}l16 6" stroke="#f0d4a0" stroke-width="3" stroke-linecap="round"/>`).join("") : `<ellipse cx="${cx - w * .18}" cy="${y - 22}" rx="${w * .16}" ry="5" fill="#fff" opacity=".2"/>`}${spec.bg ? `<ellipse cx="${cx}" cy="${y - 14}" rx="12" ry="4" fill="#8a5a24" opacity=".5"/>` : ""}${bread === "kaiser" || bread === "bagel" ? [...Array(12)].map(() => `<ellipse cx="${(cx + (R() - .5) * w * .7).toFixed(1)}" cy="${(y - 10 - R() * 22).toFixed(1)}" rx="1.6" ry=".8" fill="#fff4dc"/>`).join("") : ""}`;
    s += stack(cx, w, top, bot, 1);
    return s;
  }

  function svg(r) {
    const R = rng(r.id);
    const bg = BG[r.c] || "#efe7da";
    let body = "";
    if (r.c === "Sandwichs") body = sandwich(r, R);
    else if (PLATE.has(r.k) || r.k === "boulettes" && has(r, "spaghetti")) {
      body = `<ellipse cx="120" cy="80" rx="100" ry="62" fill="#000" opacity=".08"/><ellipse cx="120" cy="75" rx="100" ry="62" fill="#fbfaf6" stroke="#e5ddcc" stroke-width="2"/><ellipse cx="120" cy="75" rx="74" ry="44" fill="#f3efe5"/>` + fill(r, R, 120, 75, 66, 39);

      const cheese = r.k === "pate_chinois" ? null : r.k === "frittata" ? "#f2c13a" : "#f4d26a";

      if (r.k === "pate_chinois") body += `<rect x="30" y="24" width="180" height="98" rx="12" fill="#f3dc96"/>` + [...Array(30)].map(() => `<path d="M${(40 + R() * 160).toFixed(0)} ${(34 + R() * 80).toFixed(0)}q6 -6 12 0" stroke="#d9a94a" stroke-width="2" fill="none"/>`).join("") + [...Array(12)].map(() => `<circle cx="${(40 + R() * 160).toFixed(0)}" cy="${(34 + R() * 80).toFixed(0)}" r="1.5" fill="#c0392b"/>`).join("");

<script>
// Multi-provider AI layer: Claude (Anthropic), Gemini (Google), Grok (xAI).
// Keys stay on this device (localStorage). Each call can use web search and images.
// If the chosen AI fails (limit reached, bad key, network), the next one is tried automatically.
(function (root) {
  const PROVIDERS = {
    claude: { name: "Claude", model: "claude-sonnet-5-5", keyUrl: "https://console.anthropic.com/settings/keys" },
    gemini: { name: "Gemini", model: "gemini-3.5-flash", keyUrl: "https://aistudio.google.com/apikey" },
    grok: { name: "Grok", model: "grok-4.7", keyUrl: "https://console.x.ai" },
  };
  const ORDER = ["claude", "gemini", "grok"];

  class AIError extends Error {
    constructor(code, message) { super(message); this.code = code; }
  }

  function friendly(status, body) {
    if (status === 401 || status === 403) return new AIError("key", "Clé refusée (vérifie la clé dans Réglages IA).");
    if (status === 429) return new AIError("limit", "Limite atteinte pour cette IA.");
    if (status === 402) return new AIError("limit", "Plus de crédit sur ce compte.");
    if (status === 404) return new AIError("model", "Modèle introuvable (change le nom du modèle dans Réglages IA).");
    if (status >= 500) return new AIError("down", "Le service de cette IA ne répond pas pour l'instant.");
    return new AIError("other", "Erreur " + status + " : " + String(body || "").slice(0, 160));
  }

  async function blobToB64(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = "";
    for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s);
  }

  async function post(url, headers, body, signal) {
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: Object.assign({ "content-type": "application/json" }, headers), body: JSON.stringify(body), signal });
    } catch (e) {
      throw new AIError("network", "Impossible de joindre cette IA (Internet coupé, ou elle refuse les appels depuis une app web).");
    }
    const text = await res.text();
    if (!res.ok) throw friendly(res.status, text);
    try { return JSON.parse(text); } catch (e) { throw new AIError("other", "Réponse illisible."); }
  }

  // ---- Claude (Anthropic Messages API) ----
  async function callClaude(cfg, prompt, opt) {
    const content = [];
    for (const img of opt.images || []) content.push({ type: "image", source: { type: "base64", media_type: img.type || "image/jpeg", data: await blobToB64(img) } });
    content.push({ type: "text", text: prompt });
    const body = { model: cfg.model || PROVIDERS.claude.model, max_tokens: opt.maxTokens || 8000, messages: [{ role: "user", content }] };
    if (opt.web) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 8 }];
    const data = await post("https://api.anthropic.com/v1/messages",
      { "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body, opt.signal);
    return (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
  }

  // ---- Gemini (Google AI Studio, generateContent) ----
  async function callGemini(cfg, prompt, opt) {
    const parts = [];
    for (const img of opt.images || []) parts.push({ inline_data: { mime_type: img.type || "image/jpeg", data: await blobToB64(img) } });
    parts.push({ text: prompt });
    const body = { contents: [{ role: "user", parts }], generationConfig: { maxOutputTokens: opt.maxTokens || 8000 } };
    if (opt.web) body.tools = [{ google_search: {} }];
    const model = encodeURIComponent(cfg.model || PROVIDERS.gemini.model);
    const data = await post(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, { "x-goog-api-key": cfg.key }, body, opt.signal);
    const c = (data.candidates || [])[0];
    if (!c) throw new AIError("other", "Gemini n'a rien répondu.");
    return ((c.content && c.content.parts) || []).map((p) => p.text || "").join("");
  }

  // ---- Grok (xAI Responses API) ----
  async function callGrok(cfg, prompt, opt) {
    const content = [{ type: "input_text", text: prompt }];
    for (const img of opt.images || []) content.push({ type: "input_image", image_url: `data:${img.type || "image/jpeg"};base64,${await blobToB64(img)}` });
    const body = { model: cfg.model || PROVIDERS.grok.model, input: [{ role: "user", content }], max_output_tokens: opt.maxTokens || 8000 };
    if (opt.web) body.tools = [{ type: "web_search" }];
    const data = await post("https://api.x.ai/v1/responses", { authorization: "Bearer " + cfg.key }, body, opt.signal);
    if (typeof data.output_text === "string" && data.output_text) return data.output_text;
    const out = [];
    for (const item of data.output || []) if (item.type === "message") for (const c of item.content || []) if (c.text) out.push(c.text);
    return out.join("\n");
  }

  const CALL = { claude: callClaude, gemini: callGemini, grok: callGrok };

  // ---- Photos: Gemini image model or Grok Imagine (Claude does not make images) ----
  const IMG_MODELS = { gemini: "gemini-3.1-flash-image", grok: "grok-imagine-image-2.0" };
  const b64ToBlob = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
  async function imgGemini(cfg, prompt, signal) {
    const model = encodeURIComponent(cfg.model || IMG_MODELS.gemini);
    const data = await post(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, { "x-goog-api-key": cfg.key },
      { contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseModalities: ["TEXT", "IMAGE"] } }, signal);
    for (const c of data.candidates || []) for (const p of (c.content && c.content.parts) || []) {
      const d = p.inlineData || p.inline_data;
      if (d && d.data) return b64ToBlob(d.data, d.mimeType || d.mime_type || "image/png");
    }
    throw new AIError("other", "Gemini n'a pas renvoyé d'image.");
  }
  async function imgGrok(cfg, prompt, signal) {
    const data = await post("https://api.x.ai/v1/images/generations", { authorization: "Bearer " + cfg.key },
      { model: cfg.model || IMG_MODELS.grok, prompt, n: 1, response_format: "b64_json" }, signal);
    const d = (data.data || [])[0];
    if (d && d.b64_json) return b64ToBlob(d.b64_json, "image/jpeg");
    if (d && d.url) { const r = await fetch(d.url); if (r.ok) return await r.blob(); }
    throw new AIError("other", "Grok n'a pas renvoyé d'image.");
  }
  const IMG = { gemini: imgGemini, grok: imgGrok };
  const imageReady = (settings) => ["gemini", "grok"].filter((p) => settings.keys && settings.keys[p]);
  async function image(settings, prompt, opt = {}) {
    const avail = imageReady(settings);
    if (!avail.length) throw new AIError("nokey", "Il faut une clé Gemini ou Grok pour les photos.");
    const pref = settings.photoBy && avail.includes(settings.photoBy) ? settings.photoBy : avail.includes(settings.main) ? settings.main : avail[0];
    const order = [pref].concat(settings.auto === false ? [] : avail.filter((p) => p !== pref));
    const errors = [];
    for (const p of order) {
      try { return { blob: await IMG[p]({ key: settings.keys[p], model: (settings.models || {})[p + "Img"] }, prompt, opt.signal), by: p }; }
      catch (e) { if (e.name === "AbortError") throw e; errors.push(PROVIDERS[p].name + " : " + e.message); }
    }
    const err = new AIError("all", errors.join(" · "));
    throw err;
  }

  // settings: {main: "gemini", auto: true, keys: {claude, gemini, grok}, models: {...}}
  function ready(settings) { return ORDER.filter((p) => settings.keys && settings.keys[p]); }

  // Ask the chosen AI; on failure, try the others that have a key (if allowed). Returns {text, by}.
  async function ask(settings, prompt, opt = {}) {
    const avail = ready(settings);
    if (!avail.length) throw new AIError("nokey", "Aucune IA configurée : ajoute une clé dans Réglages IA.");
    const first = avail.includes(settings.main) ? settings.main : avail[0];
    const order = [first].concat(settings.auto === false ? [] : avail.filter((p) => p !== first));
    const errors = [];
    for (const p of order) {
      try {
        const text = await CALL[p]({ key: settings.keys[p], model: (settings.models || {})[p] }, prompt, opt);
        if (!text || !text.trim()) throw new AIError("other", "Réponse vide.");
        return { text, by: p, errors };
      } catch (e) {
        if (e.name === "AbortError") throw e;
        errors.push(PROVIDERS[p].name + " : " + e.message);
        if (opt.onSwitch && order.indexOf(p) < order.length - 1) opt.onSwitch(p, e);
      }
    }
    throw new AIError("all", errors.join(" · "));
  }

  // Pull the first JSON value (array or object) out of a model answer
  function extractJSON(text, kind) {
    const t = String(text || "").replace(/```(?:json)?/gi, "");
    const open = kind === "object" ? "{" : "[", close = kind === "object" ? "}" : "]";
    const a = t.indexOf(open), b = t.lastIndexOf(close);
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  root.AI = { PROVIDERS, ORDER, ask, ready, extractJSON, AIError, image, imageReady, IMG_MODELS };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Real recipe photos: made once by the chosen AI, shrunk to JPEG and kept on this device (IndexedDB).
(function (root) {
  const DBN = "panierfute-photos", ST = "photos";
  const urls = {}; // recipe id -> object URL
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(ST);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(ST, mode); const out = fn(t.objectStore(ST)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  async function loadAll() {
    try {
      const db = await open();
      await new Promise((res) => {
        const c = db.transaction(ST).objectStore(ST).openCursor();
        c.onsuccess = () => { const cur = c.result; if (!cur) return res(); urls[cur.key] = URL.createObjectURL(cur.value); cur.continue(); };
        c.onerror = () => res();
      });
    } catch (e) {}
    return Object.keys(urls).length;
  }
  // Shrink to 800x500 JPEG so 300 photos stay small (~60-90 KB each)
  async function shrink(blob) {
    try {
      const bmp = await createImageBitmap(blob);
      const W = 800, H = 500, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d"), s = Math.max(W / bmp.width, H / bmp.height);
      g.drawImage(bmp, (W - bmp.width * s) / 2, (H - bmp.height * s) / 2, bmp.width * s, bmp.height * s);
      return await new Promise((r) => c.toBlob((b) => r(b || blob), "image/jpeg", 0.82));
    } catch (e) { return blob; }
  }
  async function put(id, blob) {
    const small = await shrink(blob);
    try { await tx("readwrite", (s) => s.put(small, id)); } catch (e) {}
    if (urls[id]) URL.revokeObjectURL(urls[id]);
    urls[id] = URL.createObjectURL(small);
    return urls[id];
  }
  async function del(id) { try { await tx("readwrite", (s) => s.delete(id)); } catch (e) {} if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; } }
  async function clear() { try { await tx("readwrite", (s) => s.clear()); } catch (e) {} for (const k in urls) { URL.revokeObjectURL(urls[k]); delete urls[k]; } }
  root.Photos = { loadAll, put, del, clear, url: (id) => urls[id] || null, count: () => Object.keys(urls).length };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Free phone <-> computer sync through a private GitHub Gist.
// Only the shared app data travels (menu, ticked list, tastes, AI recipes, specials, settings).
// AI keys, photos and per-device view state never leave the device.
(function (root) {
  const API = "https://api.github.com";
  const FILE = "panierfute.json";
  const KEY = "panierfute.sync";
  let cfg = { token: "", gist: "", last: "" };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const saveCfg = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };

  async function gh(path, opt = {}) {
    let res;
    try {
      res = await fetch(API + path, Object.assign({}, opt, { headers: Object.assign({ authorization: "Bearer " + cfg.token, accept: "application/vnd.github+json", "content-type": "application/json" }, opt.headers || {}) }));
    } catch (e) { throw new Error("pas d'Internet"); }
    if (res.status === 401) throw new Error("clé GitHub refusée");
    if (res.status === 403 || res.status === 404) throw new Error("la clé GitHub n'a pas la permission « gist »");
    if (!res.ok) throw new Error("GitHub erreur " + res.status);
    return res.json();
  }

  // Find the app's gist (so the second device needs only the key), or create it
  async function connect(token, initialData) {
    cfg.token = token.trim();
    let found = null;
    for (let page = 1; page <= 5 && !found; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      found = list.find((g) => g.files && g.files[FILE]);
      if (list.length < 100) break;
    }
    if (found) cfg.gist = found.id;
    else {
      const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Panier futé - synchro (ne pas effacer)", public: false, files: { [FILE]: { content: JSON.stringify(initialData) } } }) });
      cfg.gist = g.id;
    }
    saveCfg();
    return !!found;
  }

  async function pull() {
    const g = await gh("/gists/" + cfg.gist);
    const f = g.files && g.files[FILE];
    if (!f) return null;
    let text = f.content;
    if (f.truncated && f.raw_url) { const r = await fetch(f.raw_url); text = await r.text(); }
    try { return JSON.parse(text); } catch (e) { return null; }
  }
  async function push(data) {
    await gh("/gists/" + cfg.gist, { method: "PATCH", body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(data) } } }) });
    cfg.last = new Date().toISOString(); saveCfg();
  }
  function disconnect() { cfg = { token: "", gist: "", last: "" }; saveCfg(); }

  root.Sync = { connect, pull, push, disconnect, on: () => !!(cfg.token && cfg.gist), last: () => cfg.last };
})(typeof window !== "undefined" ? window : globalThis);

</script>

// recipes I can make with what I have: most of the ingredients at home first
function stockRecipes() {
  const have = haveSet(), bans = banIds(), soon = new Set(expiring(3).map((x) => x.id).filter(Boolean));
  return REC.filter((r) => !isBanned(r, bans) && S.aime[r.id] !== -1).map((r) => {
    const miss = r.i.filter((l) => ING[l[0]] && !have.has(l[0])).map((l) => l[0]);
    const main = r.i.filter((l) => ING[l[0]] && ING[l[0]].r !== "Garde-manger et épices");
    const got = main.filter((l) => have.has(l[0])).length;
    return { r, miss, pct: main.length ? got / main.length : 0, mainHave: have.has(r.p) };
  }).map((x) => Object.assign(x, { urgent: x.r.i.filter((l) => soon.has(l[0])).length }))
    .filter((x) => x.pct >= 0.5 && (x.mainHave || x.urgent)).sort((p, q) => q.urgent - p.urgent || p.miss.length - q.miss.length || q.pct - p.pct).slice(0, 30);
}
function invIdCatalog() {

async function readReceipt(files) {
  if (invBusy || !files.length) return;
  invBusy = true; invMsg = "L'IA lit ton reçu…"; rHome();
  const prompt = `Voici la photo d'un reçu d'épicerie du Québec. Lis chaque article acheté (sans en inventer), avec :
- le nom clair en français (les reçus abrègent : « PTS POULET DESOS » = poitrines de poulet désossées),
- la quantité achetée (ex. « 1,2 kg », « 2 », « 4 L »), le prix payé total pour cette ligne,
- où le ranger à la maison (frigo, congel ou garde),
- combien de jours ça se garde à cet endroit,
- l'identifiant le plus proche dans cette liste (sinon null) :
${invIdCatalog()}
Lis aussi le nom du magasin (un de : ${L.STORES.join(", ")}, sinon null) et la date du reçu.
Ignore les taxes, sacs, consignes, rabais de carte et sous-totaux.
Réponds UNIQUEMENT par cet objet JSON : {"mag":"magasin ou null","date":"AAAA-MM-JJ","items":[{"n":"nom","qte":"quantité","prix":12.34,"zone":"frigo|congel|garde","jours":7,"id":"identifiant ou null"}]}`;
  try {
    const j = AI.extractJSON(await askAI(prompt, { images: files, maxTokens: 6000 }), "object");
    if (!j || !Array.isArray(j.items)) throw new Error("reçu illisible");
    invReview = j.items.filter((x) => x && x.n).map((x) => ({ n: String(x.n).slice(0, 60), qte: String(x.qte || "").slice(0, 30), zone: ZONES[x.zone] ? x.zone : "frigo",
      id: ING[x.id] ? x.id : null, days: Number(x.jours) > 0 ? Math.round(Number(x.jours)) : null, prix: Number(x.prix) > 0 ? Number(x.prix) : null, keep: true }));
    invReview.receipt = { mag: L.STORES.includes(j.mag) ? j.mag : null, date: /^\d{4}-\d\d-\d\d$/.test(j.date || "") ? j.date : today() };
    const tot = invReview.reduce((t, x) => t + (x.prix || 0), 0);
    invMsg = invReview.length ? `Reçu${invReview.receipt.mag ? " de " + invReview.receipt.mag : ""} : ${invReview.length} articles, ${L.FR(tot)} $. Vérifie et ajoute à l'inventaire.` : "Rien de lisible. Reprends la photo bien à plat, avec de la lumière.";
  } catch (e) { invMsg = "La lecture du reçu n'a pas marché : " + (e.message || "erreur"); }
  invBusy = false; rHome();
}
// real price paid -> history (unit price), so the deal scores learn from your own receipts
// ---------- spending log: each grocery trip (receipt = real amount, list = estimate) ----------
function logTrip(t) {
  S.depenses = S.depenses || [];
  // a receipt replaces the estimate already logged for the same day and store
  if (t.src === "recu") S.depenses = S.depenses.filter((x) => !(x.src === "liste" && x.date === t.date && (!t.mag || (x.mags || []).includes(t.mag))));
  S.depenses.push(t);
  S.depenses = S.depenses.filter((x) => x.date >= addDays(today(), -730));
}
function logReceipt(review) {
  const rc = review.receipt; if (!rc) return;
  let total = 0, regular = 0;
  for (const x of review) {
    if (!x.keep || !x.prix) continue;
    total += x.prix;
    const amt = x.id ? parseAmt(x.qte, x.id) || (ING[x.id].u === "u" ? 1 : null) : null;
    regular += amt && ING[x.id] ? Math.max(x.prix, ING[x.id].p * amt) : x.prix;
  }
  if (total > 0) logTrip({ date: rc.date || today(), mags: rc.mag ? [rc.mag] : [], mag: rc.mag, total: Math.round(total * 100) / 100, saved: Math.round(Math.max(0, regular - total) * 100) / 100, src: "recu" });
}
function finishShopping() {
  const { list, ch } = listData();
  const bought = list.filter((it) => S.coches[it.id]);
  if (!bought.length) return toast("Coche d'abord ce que tu as acheté");
  let total = 0, regular = 0;
  for (const it of bought) { const a2 = ch.assign[it.id]; total += a2 ? a2.cost : 0; regular += ING[it.id].p * it.buy; }
  const mags = [...new Set(bought.map((it) => ch.assign[it.id] && ch.assign[it.id].mag).filter(Boolean))];
  logTrip({ date: today(), mags, total: Math.round(total * 100) / 100, saved: Math.round(Math.max(0, regular - total) * 100) / 100, src: "liste" });
  // what was bought goes to the home inventory, then the list is cleared for next time
  for (const it of bought) if (ING[it.id] && ING[it.id].r !== "Garde-manger et épices") {
    const r = ING[it.id].r, zone = /Surgelés/.test(r) ? "congel" : /Épicerie|Collations|Ménager/.test(r) ? "garde" : "frigo";
    addInv(zone, { n: ING[it.id].n.split(" (")[0], id: it.id, qte: L.fmtQty(ING[it.id], it.buy), amt: ING[it.id].u === "cs" || ING[it.id].u === "ct" ? null : it.buy });
  }
  for (const it of bought) delete S.coches[it.id];
  S.extras = S.extras.filter((e) => { const c = CAT[e.k], id = c && c.link ? c.link : e.k; return !bought.some((it) => it.id === id); });
  rankCache = null; save();
  toast(`Épicerie enregistrée : ${L.FR(total)} $ (${L.FR(Math.max(0, regular - total))} $ sauvés). Tes achats sont dans l'inventaire.`);
}

function recordReceiptPrices(review) {
  const rc = review.receipt; if (!rc || !rc.mag) return 0;
  const items = [];
  for (const x of review) {
    if (!x.keep || !x.id || !x.prix) continue;
    const amt = parseAmt(x.qte, x.id) || (ING[x.id].u === "u" ? 1 : null);
    if (!amt) continue;
    items.push({ ing: x.id, mag: rc.mag, prix: x.prix, qte: amt, unite: ING[x.id].u === "g" ? "g" : ING[x.id].u === "ml" ? "ml" : "u", txt: x.n });
  }
  const d = new Date(rc.date + "T12:00"); d.setDate(d.getDate() - ((d.getDay() + 3) % 7));
  return items.length ? recordWeek({ debut: d.toISOString().slice(0, 10), items }) : 0;
}

// "environ 500 g", "1 L", "2 kg", "6", "2 lb", "une douzaine" -> amount in the ingredient's own unit (g, ml or count), or null
function parseAmt(text, id) {
  const ing = ING[id]; if (!ing || !text) return null;
  const t = norm(text).replace(",", ".");
  const m = t.match(/(\d+(?:\.\d+)?)\s*(kg|g|lb|livres?|l|litres?|ml|douzaines?|dz)?/);
  let n = m ? Number(m[1]) : /douzaine/.test(t) ? 1 : /une?\b|un pot|un sac|un paquet/.test(t) ? 1 : null;
  const u = m && m[2] ? m[2] : /douzaine/.test(t) ? "dz" : "";
  if (n == null) return null;
  if (ing.u === "g") { if (u === "kg") return n * 1000; if (u === "g") return n; if (/^(lb|livre)/.test(u)) return n * 453.6; return null; }
  if (ing.u === "ml") { if (/^l/.test(u)) return n * 1000; if (u === "ml") return n; return null; }
  if (ing.u === "u") { if (/^(douzaine|dz)/.test(u)) return n * 12; if (!u) return n; return null; }
  return null;
}
// typical keeping time (days) by zone and aisle, used when the AI gives no date
function shelfDays(id, zone) {
  const r = (ING[id] || {}).r || "";
  if (zone === "congel") return /Viandes|Poissons/.test(r) ? 120 : 180;
  if (zone === "garde") return /Fruits/.test(r) ? 14 : 365;
  if (/Viandes|Poissons/.test(r)) return 3;
  if (/laitiers/.test(r)) return id === "oeufs" ? 28 : 10;
  if (/Fruits/.test(r)) return 7;
  if (/Boulangerie/.test(r)) return 5;
  return 14;
}
function addInv(zone, item) {
  const L2 = zoneList(zone), same = L2.find((x) => (item.id && x.id === item.id) || norm(x.n) === norm(item.n));
  const amt = item.amt != null ? item.amt : parseAmt(item.qte, item.id);
  const exp = item.exp || (item.days ? addDays(today(), Number(item.days)) : item.id ? addDays(today(), shelfDays(item.id, zone)) : "");
  if (same) { same.qte = item.qte || same.qte; same.amt = amt != null ? amt : same.amt; same.date = today(); same.exp = exp || same.exp; }
  else L2.push({ n: item.n, id: item.id || null, qte: item.qte || "", amt, date: today(), exp });
}
// match a typed name to a known ingredient (typo tolerant)
function guessIng(text) {
  const t = norm(text).trim(); if (!t) return null;
  let best = null, bs = 0;
  for (const [k, g] of Object.entries(ING)) {
    const n = norm(g.n.split(" (")[0]);
    let s = n === t ? 100 : n.startsWith(t) || t.startsWith(n) ? 85 : n.includes(t) ? 70 : 0;
    if (!s) { const short = n.split(" ").slice(0, t.split(" ").length).join(" "); const d = Math.min(lev(t, short), lev(t, n.slice(0, t.length))); s = (1 - d / Math.max(t.length, 3)) * 70; }
    if (s > bs) { bs = s; best = k; }
  }
  return bs >= 55 ? best : null;
}
// items close to their date (or past it), soonest first
function expiring(days = 3) {
  const out = [];
  for (const z of ["frigo", "congel", "garde"]) for (const x of zoneList(z)) if (x.exp) {
    const left = Math.round((new Date(x.exp + "T12:00") - new Date(today() + "T12:00")) / 864e5);
    if (left <= days) out.push(Object.assign({ z, left }, x));
  }
  return out.sort((p, q) => p.left - q.left);
}

// Estimated cost of one recipe at its chosen size (best price in my stores, pantry items free)
function recipeCost(r) {
  const ix = rankCache ? rankCache.ix : idx();
  let c = 0;
  for (const [id, q] of L.scaleRecipe(r, ING, cfgOf(r.id), ajustOf(r.id))) {
    if (inPantry(id) || !ING[id]) continue;
    const ing = ING[id], sp = (ix[id] || []).find((x) => S.reg.stores.includes(x.mag));

function autoMenu() {

  const budget = Number(S.reg.budget) || 0;
  if (budget > 0) { // stay under budget: recipes that fit their share of the budget, best value first
    const per = budget / 5;
    const withCost = pool.map((x) => Object.assign({}, x, { cost: recipeCost(x.r) }));
    const fit = withCost.filter((x) => x.cost <= per * 1.15);
    pool = (fit.length >= 8 ? fit : withCost.sort((p, q) => p.cost - q.cost).slice(0, 40)).sort((p, q) => q.rank - p.rank + (p.cost - q.cost) / 10);
  }
  for (let n = Math.max(menu.length + 1, 5); n <= 8; n++) {
    menu = L.autoPick(menu, pool, BYID, n);

}

// what my inventory says I have for this ingredient (zone + quantity), or null
function invHas(id) {
  let found = null, total = 0, known = true;
  for (const z of ["frigo", "congel", "garde"]) for (const x of ((S.inv || {})[z] || [])) if (x.id === id) {
    if (!found) found = { z, qte: x.qte };

}

function listData() {

    const left = it.buy - h.amt, unitCount = ING[it.id].u === "u";

function bestFor(k) {

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function suggest(text) {
  const q = norm(text).trim();
  if (!q) return [];
  const qw = q.split(/[^a-z0-9]+/).filter(Boolean);
  const out = [];
  for (const c of window.CATALOG || []) {
    const name = norm(c.n), nameW = name.split(/[^a-z0-9]+/).filter(Boolean), alW = norm(c.al || "").split(/[^a-z0-9]+/).filter(Boolean);
    let s = 0;
    if (name.startsWith(q)) s = 100; else if (name.includes(q)) s = 88;
    else {
      let tot = 0;
      for (const w of qw) {
        let best = 0;
        for (const [list, wgt] of [[nameW, 1], [alW, 0.9]]) for (const x of list) {
          let v;
          if (x === w) v = 1; else if (x.startsWith(w) && w.length >= 2) v = 0.95;
          else { const d = lev(w, x.slice(0, Math.max(w.length, Math.min(x.length, w.length + 2)))); v = 1 - d / Math.max(w.length, 3); }
          best = Math.max(best, v * wgt);
        }
        tot += best;
      }
      s = (tot / qw.length) * 80;
    }
    if (s >= 50) out.push({ c, s });
  }
  return out.sort((a, b) => b.s - a.s || a.c.n.length - b.c.n.length).slice(0, 7).map((x) => x.c);
}

// ---------- search: ignores accents (boeuf = bœuf), small words and plurals ----------
const norm = (s) => String(s || "").toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const STOP = new Set(["de", "du", "des", "la", "le", "les", "au", "aux", "a", "et", "en", "avec", "d", "l", "un", "une", "pour", "sur"]);
const stem = (w) => (w.length > 3 ? w.replace(/(s|x)$/, "") : w);
const searchWords = (q) => norm(q).split(/[^a-z0-9]+/).filter((w) => w.length > 1 && !STOP.has(w)).map(stem);
const wordsOf = (s) => new Set(norm(s).split(/[^a-z0-9]+/).filter(Boolean).map(stem));
function searchScore(r, words) {
  const name = wordsOf(r.n), cat = wordsOf(r.c), main = wordsOf(ING[r.p] ? ING[r.p].n : "");
  // broths, sauces and spices don't count ("bouillon de bœuf" doesn't make a beef recipe)
  const ings = wordsOf(r.i.map((i) => ING[i[0]]).filter((g) => g && g.r !== "Garde-manger et épices" && !/^(bouillon|sauce)/i.test(g.n)).map((g) => g.n).join(" "));
  const has = (set, w) => set.has(w) || [...set].some((x) => x.length > 4 && w.length > 4 && (x.startsWith(w) || w.startsWith(x)));
  let s = 0;
  for (const w of words) {
    if (has(name, w)) s += 10;
    else if (has(cat, w)) s += 8;
    else if (has(main, w)) s += 6;
    else if (has(ings, w)) s += 1;
    else return 0; // every word must be found somewhere
  }
  return s;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if ((m = t.match(/minuterie (?:de |pour )?(\w+) ?(minutes?|min|heures?|h|secondes?)/))) {
    const n = num(m[1]); if (n) { const sec = /^h/.test(m[2]) ? n * 3600 : /^s/.test(m[2]) ? n : n * 60; return startTimer(sec, "Minuterie vocale"); }
  }

    const what = m[1].trim(), s = suggest(what);

    if (aiOn()) return aiAddItem(what);
    return addExtra("u_" + what.replace(/[^a-z0-9]+/g, "_").slice(0, 40), what.charAt(0).toUpperCase() + what.slice(1));

  if (/menu/.test(t)) return show("menu", false);
  if (/special|circulaire/.test(t)) return show("speciaux", false);
