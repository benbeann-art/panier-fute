<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier futé</title>
<meta name="theme-color" content="#d4241b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: practical, cheerful, like the Thursday flyer on the kitchen table
   IDEA: a grocery flyer + the fridge list — specials as bold price tags with a 1-10 deal score
   PICTURE: the working app itself — price-tag rows, the 7-day grid, the tickable list
   COLOUR and TYPE: flyer red, price-tag yellow, paper white / warm night; Archivo 900 for prices and titles
   LAYOUT: one column on phone, two on computer; bottom tab bar on phone, top on wide screens */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#141210);--paper:light-dark(#f4f1ea,#1f1c19);--ink:light-dark(#151515,#f3efe7);
 --mute:light-dark(#5d5952,#b3ada3);--line:light-dark(#e2ddd3,#34302b);
 --red:light-dark(#d4241b,#ff5a4b);--redbg:light-dark(#d4241b,#c4271e);--yel:#ffd400;--green:light-dark(#2f7d32,#7fcf83)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;background:var(--redbg);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 10px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-weight:600;font-size:13px;opacity:.9;letter-spacing:0}
.sync{margin-left:auto;font-size:13px;opacity:.9;text-align:right}
.gear{border:0;background:rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}.gear svg{width:24px;height:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;min-height:60px;font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--red)}
nav.tabs .n{font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;margin-left:2px}
main{max-width:1180px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.view{display:none}.view.on{display:block}
h1{font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-weight:800;font-size:20px;margin:26px 0 10px;line-height:1.2}
.lead{color:var(--mute);margin:0 0 14px;max-width:68ch}
.btn{border:2px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-width:1.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--paper);border-radius:16px;padding:14px 16px}
.tag{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px 10px 10px 2px;background:var(--yel);color:#151515;font-weight:900;font-size:22px;line-height:1;position:relative;flex:none}
.tag small{font-size:9px;font-weight:700;position:absolute;bottom:3px;right:5px}
.tag.hot{background:var(--red);color:#fff}
.tag.mini{min-width:30px;height:24px;font-size:13px;border-radius:6px 6px 6px 1px}
.price{font-weight:900;font-size:20px;white-space:nowrap}
.mute{color:var(--mute)}.small{font-size:14px}
/* specials */
.spec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.spec .nm{font-weight:700;line-height:1.25}
.spec .meta{font-size:14px;color:var(--mute)}
.spec .go{grid-column:2/4;justify-self:start;border:0;background:none;color:var(--red);font-weight:700;padding:4px 0;font-size:14px;min-height:32px}
.spec .x{border:0;background:none;color:var(--mute);font-size:20px;width:36px;height:36px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.week{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}
.warn{background:light-dark(#fff3c4,#3a3110);border-radius:12px;padding:10px 14px;margin:10px 0}
fieldset{border:0;margin:0;padding:0}
label.f{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
textarea{min-height:110px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
details>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* menu */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.day{background:var(--paper);border-radius:14px;padding:10px 12px}
.day h3{margin:0 0 6px;font-size:17px;font-weight:900}
.meal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);width:100%;text-align:start;background:none;border-left:0;border-right:0;border-bottom:0;min-height:48px}
.meal b{font-size:13px;color:var(--mute);font-weight:700;padding-top:2px}
.meal span{font-weight:600;line-height:1.3}
.meal i{display:block;font-style:normal;font-size:12px;color:var(--mute);font-weight:500}
.meal.empty span{color:var(--mute);font-weight:500}
.cook{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.cook .nm{font-weight:700;border:0;background:none;padding:0;text-align:start}
/* list */
.store{margin-top:18px}
.store>h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0;padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:12px 12px 0 0;font-size:18px;font-weight:900}
.aisle{font-size:13px;font-weight:700;color:var(--mute);padding:10px 2px 2px;text-transform:none}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;min-height:52px}
.item .bx{width:24px;height:24px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center}
.item .q{display:block;font-size:14px;color:var(--mute)}
.item .p{text-align:right;font-weight:700;white-space:nowrap;font-size:15px}
.item.done{opacity:.55}.item.done .nm{text-decoration:line-through}
.item.done .bx{background:var(--green);border-color:var(--green);color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{background:var(--paper);border-radius:14px;padding:10px 12px}
.sum b{display:block;font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.1}
/* recipes */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:12px}
.rec{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rec .pic{display:block;border:0;padding:0;margin:-12px -14px 4px;background:none;border-radius:14px 14px 0 0;overflow:hidden}
.rec .pic svg,.hero svg,.thumb svg{display:block;width:100%;height:auto}
.ph img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;background:var(--paper)}
.hero{margin:0 0 10px;border-radius:14px;overflow:hidden;max-width:520px}
.cook .thumb{width:84px;border:0;padding:0;border-radius:10px;overflow:hidden;background:none}
.rec .nm{font-weight:800;font-size:17px;line-height:1.25;background:none;border:0;padding:0;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.sp{background:var(--yel);border-color:var(--yel);color:#151515}
.rec .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.save{font-weight:900;color:var(--green)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.45)}
.sheet.on{display:block}
.sheet .in{position:absolute;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(4vw,16px) calc(24px + env(safe-area-inset-bottom))}
@media(min-width:900px){.sheet .in{inset:4vh auto 4vh 50%;transform:translateX(-50%);width:min(760px,94vw);border-radius:20px;max-height:none}}
.sheet h2{font-size:clamp(24px,5vw,32px);font-weight:900;margin:6px 0 8px;line-height:1.1}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ings .q{font-weight:700;white-space:nowrap;text-align:right}
ol.steps{padding-left:22px}ol.steps li{margin:0 0 10px}
.close{position:sticky;top:0;float:right;border:0;background:var(--paper);border-radius:50%;width:44px;height:44px;font-size:22px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;display:none;max-width:90vw}
.empty{padding:24px;text-align:center;background:var(--paper);border-radius:16px}
@media(min-width:900px){body{padding-bottom:0}nav.tabs{position:sticky;top:64px;bottom:auto;max-width:1180px;margin:0 auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(4,max-content);gap:6px;padding:0 max(4vw,14px)}
 nav.tabs button{flex-direction:row;min-height:52px;font-size:15px;padding:0 14px;gap:8px}nav.tabs button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--red)}.toast{bottom:24px}}
@media(max-width:760px){.split{grid-template-columns:minmax(0,1fr)}.sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sum div:first-child{grid-column:1/3}}
@media(prefers-reduced-motion:no-preference){.item,.meal{transition:opacity .2s}.sheet .in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}@media(min-width:900px){.sheet .in{animation:none}}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Panier futé<small>Spéciaux → recettes</small></div>
  <div class="sync" id="sync"></div>
  <button class="gear" data-v="reglages" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<nav class="tabs" aria-label="Sections">
  <button data-v="speciaux"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Spéciaux</button>
  <button data-v="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Menu</button>
  <button data-v="epicerie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span>Épicerie<span class="n" id="nleft" hidden></span></span></button>
  <button data-v="recettes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M8 9h8M8 13h6"/></svg>Recettes</button>
</nav>
<main>
  <section class="view" id="v-speciaux"></section>
  <section class="view" id="v-menu"></section>
  <section class="view" id="v-epicerie"></section>
  <section class="view" id="v-recettes"></section>
  <section class="view" id="v-reglages"></section>
  <p class="mute small" id="loading">Chargement des recettes et des spéciaux…</p>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

,"p":"tofu","t":50,"k":"plaque","i":[["tofu",3],["patate_douce",1500],["poivron",4],["oignon",3],["brocoli",2],["riz",700],["huile_olive",5],["paprika",3],["ail_poudre",2],["origan",2],["sel",3],["poivre",2],["citron",2]],"s":["Préchauffer le four à 220 °C (425 °F). Cuire le riz.","Couper les patates douces en cubes, les mélanger avec la moitié de l'huile et des épices, cuire 15 min sur 2 plaques.","Ajouter la protéine, les poivrons, l'oignon et le brocoli enrobés du reste de l'huile et des épices.","Poursuivre la cuisson 12 à 15 min (poisson) ou 20 à 25 min (viande) jusqu'à cuisson complète. Arroser de jus de citron."]},{"id":"090-pt-chinois-au-buf-hach","n":"Pâté chinois au bœuf haché","c":"Au four","l":"micro","p":"boeuf_hache","t":70,"k":"pate_chinois","i":[["boeuf_hache",2000],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Dorer le bœuf haché en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 71 °C). Retirer l'excédent de gras. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"091-pt-chinois-au-porc-hach","n":"Pâté chinois au porc haché","c":"Au four","l":"micro","p":"porc_hache","t":70,"k":"pate_chinois","i":[["porc_hache",2000],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Dorer le porc haché en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 71 °C). Retirer l'excédent de gras. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"092-pt-chinois-la-dinde-hache","n":"Pâté chinois à la dinde hachée","c":"Au four","l":"micro","p":"dinde_hachee","t":70,"k":"pate_chinois","i":[["dinde_hachee",2000],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Dorer le dinde hachée en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 74 °C). Retirer l'excédent de gras. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"093-pt-chinois-aux-lentilles","n":"Pâté chinois aux lentilles","c":"Au four","l":"micro","p":"lentilles","t":70,"k":"pate_chinois","i":[["lentilles",4],["patate",2500],["mais_conserve",2],["mais",500],["oignon",2],["beurre",80],["lait",250],["sel",3],["poivre",1],["paprika",1],["huile",1]],"s":["Ajouter les lentilles rincées et égouttées. Ajouter l'oignon haché en cours de cuisson.","Cuire les pommes de terre pelées à l'eau salée 20 min, piler avec le beurre et le lait chaud.","Dans 2 plats de 23 x 33 cm, étager : viande, maïs en crème mélangé au maïs en grains, purée. Saupoudrer de paprika.","Cuire au four à 190 °C (375 °F) 30 min. Se coupe en portions et se congèle bien."]},{"id":"094-bols-burrito-de-buf-hach","n":"Bols burrito de bœuf haché","c":"Mexicain","l":"micro","p":"boeuf_hache","t":40,"k":"bols_burrito","i":[["boeuf_hache",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Dorer le bœuf haché en l'émiettant, 8 à 10 min, jusqu'à ce qu'il ne soit plus rosé (température interne 71 °C). Retirer l'excédent de gras. Assaisonner avec le chili, le cumin et l'ail en poudre.","Sauter oignon et poivron 5 min, ajouter haricots rincés et maïs, chauffer.","Monter les bols : riz, protéine, légumes, salsa, fromage. Laitue et crème sure dans un petit pot à part pour le lunch."]},{"id":"095-bols-burrito-de-poulet","n":"Bols burrito de poulet","c":"Mexicain","l":"micro","p":"poulet_poitrine","t":40,"k":"bols_burrito","i":[["poulet_poitrine",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Couper la viande (poitrines de poulet désossées) en cubes de 2 cm et la dorer à feu vif en 2 ou 3 fois, jusqu'à cuisson complète (74 °C à cœur). Assaisonner avec le chili, le cumin et l'ail en poudre.","Sauter oignon et poivron 5 min, ajouter haricots rincés et maïs, chauffer.","Monter les bols : riz, protéine, légumes, salsa, fromage. Laitue et crème sure dans un petit pot à part pour le lunch."]},{"id":"096-bols-burrito-de-hauts-de-cuisse-de-poulet","n":"Bols burrito de hauts de cuisse de poulet","c":"Mexicain","l":"micro","p":"poulet_cuisse","t":40,"k":"bols_burrito","i":[["poulet_cuisse",2000],["riz",800],["haricots_noirs",2],["mais",500],["salsa",650],["poivron",2],["oignon",2],["chili_poudre",4],["cumin",3],["ail_poudre",2],["lime",3],["coriandre",1],["cheddar",300],["creme_sure",250],["laitue",1],["sel",2],["huile",3]],"s":["Cuire le riz, ajouter le jus de 2 limes et la coriandre hachée.","Couper la viande (hauts de cuisse de // Pure logic: prices, deal scores, store choice, weekly plan, grocery list. Shared by the page and the Node tests.
(function (root) {
  const STORES = ["Maxi", "Super C", "IGA", "Metro", "Provigo", "Walmart", "Adonis"];
  const DAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const LB = 453.6;

  // Price of one recipe-unit of an ingredient from a flyer special; null if units don't match
  function unitPrice(sp, ing) {
    if (!ing || !(sp.prix > 0)) return null;
    const q = sp.qte > 0 ? sp.qte : 1;
    if (ing.u === "g") {
      if (sp.unite === "lb") return sp.prix / (LB * q);
      if (sp.unite === "kg") return sp.prix / (1000 * q);
      if (sp.unite === "g") return sp.prix / q;
      return null;
    }
    if (ing.u === "ml") {
      if (sp.unite === "L") return sp.prix / (1000 * q);
      if (sp.unite === "ml") return sp.prix / q;
      return null;
    }
    if (ing.u === "u" && sp.unite === "u") return sp.prix / q;
    return null;
  }

  // Deal score 1-10 (like Glouton): from % off the regular price, unless the special already carries one
  function cote(sp, ing) {
    if (sp.cote >= 1 && sp.cote <= 10) return Math.round(sp.cote);
    const pu = unitPrice(sp, ing);
    if (pu == null) return null;
    const pct = 1 - pu / ing.p;
    return Math.max(1, Math.min(10, Math.round((pct * 100) / 6)));
  }

  // Specials indexed per ingredient, only for stores the user shops at
  function indexSpecials(items, ING, stores) {
    const by = {};
    for (const sp of items) {
      if (!sp.ing || !ING[sp.ing] || (stores && !stores.includes(sp.mag))) continue;
      const pu = unitPrice(sp, ING[sp.ing]);
      if (pu == null || pu >= ING[sp.ing].p) continue; // not a real saving
      (by[sp.ing] = by[sp.ing] || []).push({ ...sp, pu, cote: cote(sp, ING[sp.ing]) });
    }
    for (const k in by) by[k].sort((a, b) => a.pu - b.pu);
    return by;
  }

  // How much a recipe saves thanks to this week's specials
  function scoreRecipe(r, ING, idx, f = 1) {
    let save = 0, best = 0;
    const hits = [];
    for (const [id, q] of r.i) {
      const s = idx[id];
      if (!s) continue;
      const ing = ING[id];
      const amt = ing.u === "u" ? Math.ceil(q * f) : q * f;
      save += (ing.p - s[0].pu) * amt;
      best = Math.max(best, s[0].cote || 0);
      hits.push({ id, cote: s[0].cote, mag: s[0].mag });
    }
    hits.sort((a, b) => b.cote - a.cote);
    return { save, best, hits };
  }

      case "tomato": return `<g ${t}><circle r="${s * .85}" fill="${c1}"/><circle r="${s * .45}" fill="${c2}" opacity=".7"/><circle cx="${-s * .3}" cy="${-s * .35}" r="${s * .18}" fill="#fff" opacity=".5"/></g>`;
      case "leaf": return `<g ${t}><path d="M${-s * 1.2} 0q${s * 1.2} ${-s * 1.2} ${s * 2.4} 0q${-s * 1.2} ${s * 1.2} ${-s * 2.4} 0" fill="${c1}"/><path d="M${-s} 0h${s * 2}" stroke="${c2}" stroke-width="1"/></g>`;
      case "dot": return `<g ${t}><circle r="${s * .38}" fill="${c1}"/><circle cx="${s * .7}" cy="${s * .2}" r="${s * .34}" fill="${c2}"/></g>`;
      case "mush": return `<g ${t}><path d="M${-s} 0a${s} ${s * .8} 0 0 1 ${s * 2} 0z" fill="${c1}"/><rect x="${-s * .25}" y="0" width="${s * .5}" height="${s * .6}" fill="#efe2c8"/></g>`;
      case "potato": return `<g ${t}><rect x="${-s * .7}" y="${-s * .6}" width="${s * 1.4}" height="${s * 1.2}" rx="${s * .3}" fill="${c1}"/><rect x="${-s * .4}" y="${-s * .4}" width="${s * .5}" height="${s * .3}" rx=".2" fill="#fff" opacity=".3"/></g>`;
      case "pod": return `<g ${t}><path d="M${-s * 1.4} 0q${s * 1.4} ${-s * .9} ${s * 2.8} 0q${-s * 1.4} ${s * .6} ${-s * 2.8} 0" fill="${c1}" stroke="${c2}"/></g>`;
      case "olive": return `<g ${t}><circle r="${s * .55}" fill="none" stroke="${c1}" stroke-width="${s * .35}"/></g>`;
      case "sprout": return `<g ${t}><path d="M${-s * 1.3} 0q${s * 1.3} ${s * .4} ${s * 2.6} ${-s * .3}" stroke="${c1}" stroke-width="${s * .3}" fill="none" stroke-linecap="round"/><circle cx="${s * 1.3}" cy="${-s * .3}" r="${s * .3}" fill="#e2d48a"/></g>`;
    }
    return "";
  }

  // base layer inside a region (cx, cy, rx, ry)
  function base(r, R, cx, cy, rx, ry) {
    const out = [];
    const scatter = (n, f) => { for (let i = 0; i < n; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .92; out.push(f(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, R() * 360)); } };
    if (has(r, "spaghetti") || has(r, "nouilles_oeufs") || has(r, "nouilles_lomein") || has(r, "nouilles_riz")) {
      const col = has(r, "nouilles_riz") ? "#f4ead2" : "#f0c766";
      for (let i = 0; i < 16; i++) { const y = cy - ry * .8 + (ry * 1.6 * i) / 15, w = rx * Math.sqrt(Math.max(0, 1 - ((y - cy) / ry) ** 2)) * .95;
        out.push(`<path d="M${cx - w} ${y.toFixed(1)}q${w * .5} ${(R() * 10 - 5).toFixed(1)} ${w} 0t${w} 0" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`); }
    } else if (has(r, "pates") || has(r, "macaroni")) {
      scatter(34, (x, y, a) => `<rect x="${(x - 5).toFixed(1)}" y="${(y - 2.2).toFixed(1)}" width="10" height="4.4" rx="2" fill="#f2c25a" stroke="#d9a33a" stroke-width=".8" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
    } else if (has(r, "riz") || has(r, "riz_basmati")) {
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#f7f2e4"/>`);
      scatter(60, (x, y, a) => `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2.2" ry=".9" fill="#e6dcc2" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
    } else if (has(r, "couscous") || has(r, "quinoa")) {
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#e9cf92"/>`);
      scatter(70, (x, y) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1" fill="#d4b26a"/>`);
    } else if (has(r, "patate")) {
      if (r.k === "roti" || r.k === "plaque") scatter(10, (x, y, a) => veg("potato", x, y, 6.5, "#e9b955", "", a));
      else out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx * .95}" ry="${ry * .95}" fill="#f3e3b5"/><path d="M${cx - rx * .6} ${cy}q${rx * .3} -8 ${rx * .6} 0t${rx * .6} 0" stroke="#e2cd8e" stroke-width="2" fill="none"/>`);
    }
    return out.join("");
  }

  function fill(r, R, cx, cy, rx, ry, opt = {}) {
    let s = "";
    const sauce = SAUCE[r.k];
    if (opt.full && sauce) s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${sauce}"/>`;
    s += opt.noBase ? "" : base(r, R, cx, cy, rx, ry);
    if (!opt.full && sauce && !opt.noSauce) s += `<path d="M${cx - rx * .5} ${cy - ry * .2}c${rx * .3} ${-ry * .5} ${rx * .8} ${-ry * .4} ${rx * .9} ${ry * .1}c${rx * .05} ${ry * .5} ${-rx * .7} ${ry * .7} ${-rx * .9} ${ry * .25}z" fill="${sauce}" opacity=".88"/>`;
    let pr = PROT[r.p];
    if (pr && (r.k === "boulettes" || r.k === "ragout_boulettes" || /boulettes/i.test(r.n))) pr = ["ball", pr[1], pr[2]];
    if (pr && (r.k === "pain_viande" || (r.k === "roti" && r.p === "porc_filet"))) pr = ["slice", pr[1], pr[2]];
    const items = [];
    if (pr) {
      const [k, c1, c2] = pr;
      const big = { whole: 1, rib: 3, chop: 4, fillet: 3, drum: 5 }[k];
      const n = big || (k === "ball" ? 7 : 0) || (k === "crumb" || k === "tiny" || k === "pea" || k === "bean" ? 26 : 11);
      const sz = big ? (k === "whole" ? Math.min(rx, ry) * .32 : k === "rib" ? 7 : 8) : k === "ball" ? 9 : k === "slice" ? 9 : k === "crumb" ? 5.5 : k === "tiny" ? 4.6 : k === "pea" || k === "bean" ? 7 : 6.5;
      for (let i = 0; i < n; i++) {
        const a = R() * 6.283, d = big === 1 ? 0 : Math.sqrt(R()) * (big ? .55 : .7);
        let x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
        if (big && big > 1) { x = cx - rx * .55 + (rx * 1.1 * (i + .5)) / n; y = cy + (R() - .5) * ry * .5; }
        items.push(shape(k, x, y, sz, c1, c2, big ? (R() - .5) * 40 : R() * 360, R));
      }
    }
    for (const [k, c1, c2] of vegList(r).slice(0, 4)) {
      const n = k === "dot" ? 8 : 4;
      for (let i = 0; i < n; i++) { const a = R() * 6.283, d = .25 + Math.sqrt(R()) * .62; items.push(veg(k, cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, 5.5, c1, c2, R() * 360)); }
    }
    // shuffle so meat and vegetables mix
    for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
    s += items.join("");
    if (opt.cheese) for (let i = 0; i < 14; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .85; s += `<ellipse cx="${(cx + Math.cos(a) * rx * d).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * d).toFixed(1)}" rx="${(6 + R() * 6).toFixed(1)}" ry="${(4 + R() * 4).toFixed(1)}" fill="${opt.cheese}" opacity=".85"/>`; }
    if (has(r, "coriandre") || has(r, "persil") || has(r, "oignon_vert")) for (let i = 0; i < 12; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .8; s += `<circle cx="${(cx + Math.cos(a) * rx * d).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * d).toFixed(1)}" r="1.6" fill="#3c8a2e"/>`; }
    if (has(r, "parmesan") && !opt.cheese) for (let i = 0; i < 18; i++) { const a = R() * 6.283, d = Math.sqrt(R()) * .8; s += `<rect x="${(cx + Math.cos(a) * rx * d).toFixed(1)}" y="${(cy + Math.sin(a) * ry * d).toFixed(1)}" width="2.4" height="1.2" fill="#fff8e0"/>`; }
    return s;
  }

  const BG = { "Sandwichs": "#f7e3c8", "Pâtes": "#f3d9cf", "Sautés et riz": "#e5ead3", "Au four": "#f0dcc4", "Soupes et chilis": "#efd6c7", "Mexicain": "#f6dfb6",
    "Caris et mijotés": "#f3dcb8", "Salades-repas": "#dcebd2", "Œufs": "#f6e8bc", "Poisson": "#d8e6ea" };

  function sandwich(r, R) {
    const bread = ["pain_tranche", "kaiser", "baguette", "tortilla", "pita", "croissant", "ciabatta", "bagel", "pain_sousmarin"].find((b) => has(r, b)) || "pain_tranche";
    const pr = PROT[r.p] || ["slice", "#e8bd85", "#c98f55"];
    const layers = [];
    if (has(r, "laitue") || has(r, "epinards")) layers.push(["wave", "#5fa034"]);
    if (has(r, "tomate")) layers.push(["band", "#e0352b"]);
    if (has(r, "fromage_tranche") || has(r, "cheddar") || has(r, "mozzarella")) layers.push(["band", "#f6c33a"]);
    if (has(r, "chou") || has(r, "carotte")) layers.push(["wave", "#f0d9a8"]);
    layers.push(["prot", pr[1]]);
    const cx = W / 2, cy = H / 2 + 6;
    let s = `<ellipse cx="${cx}" cy="${H - 18}" rx="98" ry="10" fill="#000" opacity=".08"/>`;
    const stack = (x, w, top, bot, round) => {
      let g = "", y = cy - 2;
      g += bot;
      for (const [k, c] of layers.slice().reverse()) {
        if (k === "wave") g += `<path d="M${x - w / 2 - 4} ${y}q6 -7 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" clip-path="url(#cl${round})"/>`;
        else if (k === "band") g += `<rect x="${x - w / 2 + 2}" y="${y - 5}" width="${w - 4}" height="7" rx="3" fill="${c}"/>`;
        else g += `<rect x="${x - w / 2 - 2}" y="${y - 9}" width="${w + 4}" height="11" rx="5" fill="${c}"/><path d="M${x - w / 2} ${y - 4}h${w}" stroke="${pr[2]}" stroke-dasharray="6 5" stroke-width="2" opacity=".6"/>`;
        y -= 8;
      }
      return g + top(y);
    };
    if (bread === "tortilla") {
      for (const [x, y] of [[cx - 42, cy], [cx + 42, cy]]) {
        s += `<circle cx="${x}" cy="${y}" r="38" fill="#f1dcae" stroke="#d9b779" stroke-width="3"/>`;
        let rr = 32; for (const [k, c] of layers.concat(layers)) { s += `<circle cx="${x}" cy="${y}" r="${rr}" fill="none" stroke="${c}" stroke-width="5"/>`; rr -= 6; if (rr < 6) break; }
        s += `<circle cx="${x}" cy="${y}" r="5" fill="#f1dcae"/>`;
      }
      return s;
    }
    if (bread === "pita") {
      s += `<path d="M${cx - 70} ${cy + 26}a70 64 0 0 1 140 0z" fill="#f0d39a" stroke="#d1aa62" stroke-width="3"/>`;
      layers.forEach(([k, c], i) => { s += `<path d="M${cx - 60 + i * 6} ${cy + 26 - i * 1}q${60 - i * 6} ${-30 + i * 4} ${120 - i * 12} 0" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`; });
      s += `<path d="M${cx - 70} ${cy + 26}h140" stroke="#c99a52" stroke-width="5" stroke-linecap="round"/>`;
      return s;
    }
    const spec = {
      pain_tranche: { w: 130, col: "#d8a868", crumb: "#f6e7c8", sq: true }, kaiser: { w: 120, col: "#c98c43", crumb: "#f4dfb4" },
      baguette: { w: 190, col: "#d0954a", crumb: "#f4dfb4", long: true }, croissant: { w: 150, col: "#d99a42", crumb: "#f2d48e", cr: true },
      ciabatta: { w: 150, col: "#d8b783", crumb: "#f3e5c8", sq: true }, bagel: { w: 120, col: "#c98a40", crumb: "#efd7a8", bg: true },
      pain_sousmarin: { w: 190, col: "#d9a45c", crumb: "#f5e3bd", long: true },
    }[bread];
    const w = spec.w, x0 = cx - w / 2;
    s += `<defs><clipPath id="cl1"><rect x="${x0}" y="0" width="${w}" height="${H}"/></clipPath></defs>`;
    const bot = `<rect x="${x0}" y="${cy - 2}" width="${w}" height="${spec.sq ? 18 : 16}" rx="${spec.sq ? 5 : 9}" fill="${spec.crumb}" stroke="${spec.col}" stroke-width="4"/>`;
    const top = (y) => spec.sq
      ? `<rect x="${x0}" y="${y - 20}" width="${w}" height="20" rx="6" fill="${spec.crumb}" stroke="${spec.col}" stroke-width="4"/>`
      : spec.cr
        ? `<path d="M${x0} ${y}c10 -40 ${w - 20} -40 ${w} 0z" fill="${spec.col}"/>${[1, 2, 3, 4].map((k) => `<path d="M${x0 + (w * k) / 5} ${y}q-6 -16 4 -30" stroke="#b97a2a" stroke-width="2" fill="none"/>`).join("")}`
        : `<path d="M${x0} ${y}c${spec.long ? 6 : 4} ${spec.long ? -26 : -40} ${w - 8} ${spec.long ? -26 : -40} ${w} 0z" fill="${spec.col}"/>${spec.long ? [1, 2, 3, 4].map((k) => `<path d="M${x0 + (w * k) / 5 - 8} ${y - 18}l16 6" stroke="#f0d4a0" stroke-width="3" stroke-linecap="round"/>`).join("") : `<ellipse cx="${cx - w * .18}" cy="${y - 22}" rx="${w * .16}" ry="5" fill="#fff" opacity=".2"/>`}${spec.bg ? `<ellipse cx="${cx}" cy="${y - 14}" rx="12" ry="4" fill="#8a5a24" opacity=".5"/>` : ""}${bread === "kaiser" || bread === "bagel" ? [...Array(12)].map(() => `<ellipse cx="${(cx + (R() - .5) * w * .7).toFixed(1)}" cy="${(y - 10 - R() * 22).toFixed(1)}" rx="1.6" ry=".8" fill="#fff4dc"/>`).join("") : ""}`;
    s += stack(cx, w, top, bot, 1);
    return s;
  }

  function svg(r) {
    const R = rng(r.id);
    const bg = BG[r.c] || "#efe7da";
    let body = "";
    if (r.c === "Sandwichs") body = sandwich(r, R);
    else if (PLATE.has(r.k) || r.k === "boulettes" && has(r, "spaghetti")) {
      body = `<ellipse cx="120" cy="80" rx="100" ry="62" fill="#000" opacity=".08"/><ellipse cx="120" cy="75" rx="100" ry="62" fill="#fbfaf6" stroke="#e5ddcc" stroke-width="2"/><ellipse cx="120" cy="75" rx="74" ry="44" fill="#f3efe5"/>` + fill(r, R, 120, 75, 66, 39);
    } else if (DISH.has(r.k)) {
      const cheese = r.k === "pate_chinois" ? null : r.k === "frittata" ? "#f2c13a" : "#f4d26a";
      body = `<rect x="22" y="22" width="196" height="114" rx="18" fill="#000" opacity=".08"/><rect x="18" y="14" width="204" height="118" rx="18" fill="#2f5d8a"/><rect x="30" y="24" width="180" height="98" rx="12" fill="${SAUCE[r.k] || "#e8c070"}"/>`;
      if (r.k === "pate_chinois") body += `<rect x="30" y="24" width="180" height="98" rx="12" fill="#f3dc96"/>` + [...Array(30)].map(() => `<path d="M${(40 + R() * 160).toFixed(0)} ${(34 + R() * 80).toFixed(0)}q6 -6 12 0" stroke="#d9a94a" stroke-width="2" fill="none"/>`).join("") + [...Array(12)].map(() => `<circle cx="${(40 + R() * 160).toFixed(0)}" cy="${(34 + R() * 80).toFixed(0)}" r="1.5" fill="#c0392b"/>`).join("");
      else body += fill(r, R, 120, 73, 84, 44, { noBase: r.k !== "casserole_riz" && r.k !== "macaroni" && r.k !== "rosee", noSauce: true, cheese });
    } else if (PAN.has(r.k)) {
      body = `<rect x="14" y="16" width="214" height="122" rx="10" fill="#000" opacity=".08"/><rect x="10" y="10" width="220" height="122" rx="10" fill="#8d9298"/><rect x="18" y="18" width="204" height="106" rx="6" fill="${r.k === "pizza" ? "#e7b866" : "#a9aeb4"}"/>`;
      if (r.k === "pizza") body += `<rect x="26" y="26" width="188" height="90" rx="8" fill="#c6402a"/>` + fill(r, R, 120, 71, 88, 40, { noBase: true, noSauce: true, cheese: "#f7e2a0" });
      else if (r.k === "quesadillas" || r.k === "burritos" || r.k === "fajitas") {
        for (let i = 0; i < 4; i++) { const x = 52 + i * 46; body += r.k === "burritos" ? `<rect x="${x - 18}" y="34" width="36" height="76" rx="18" fill="#f0d9a6" stroke="#d6b06a" stroke-width="2"/><path d="M${x - 14} 50h28M${x - 14} 90h28" stroke="#d9b779" stroke-width="2"/>` : `<path d="M${x - 22} 100a26 26 0 0 1 44 -50z" fill="#f0d9a6" stroke="#d6b06a" stroke-width="2"/><path d="M${x - 16} 92a20 20 0 0 1 32 -36" stroke="${(PROT[r.p] || ["", "#c98f55"])[1]}" stroke-width="5" fill="none"/>`; }
        body += [...Array(10)].map(() => veg("pstrip", 30 + R() * 180, 30 + R() * 80, 5, "#d8322a", "", R() * 360)).join("");
      } else body += fill(r, R, 120, 71, 92, 44, { noSauce: r.k !== "cotes" && r.k !== "porc_effiloche" });
    } else if (r.c === "Salades-repas") {
      body = `<ellipse cx="120" cy="80" rx="96" ry="64" fill="#000" opacity=".08"/><ellipse cx="120" cy="74" rx="96" ry="64" fill="#e9f0e2" stroke="#c8d6bb" stroke-width="3"/>` + fill(r, R, 120, 74, 80, 52, { noSauce: true });
    } else {
      const soupy = SOUP.has(r.k);
      body = `<ellipse cx="120" cy="82" rx="96" ry="62" fill="#000" opacity=".1"/><ellipse cx="120" cy="75" rx="96" ry="62" fill="${soupy ? "#c95f3a" : "#2f6d6a"}"/><ellipse cx="120" cy="75" rx="86" ry="54" fill="${soupy ? "#e9dccb" : "#f5efe4"}"/>`;
      body += fill(r, R, 120, 75, 76, 46, { full: soupy || ["cari", "beurre_ch", "jambalaya"].includes(r.k) });
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration : ${r.n.replace(/"/g, "")}"><rect width="${W}" height="${H}" fill="${bg}"/><g opacity=".09" fill="#000">${[...Array(6)].map((_, i) => `<rect x="${i * 44 - 4}" y="0" width="20" height="${H}"/>`).join("")}</g>${body}</svg>`;
  }
  root.Illus = { svg };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Multi-provider AI layer: Claude (Anthropic), Gemini (Google), Grok (xAI).
// Keys stay on this device (localStorage). Each call can use web search and images.
// If the chosen AI fails (limit reached, bad key, network), the next one is tried automatically.
(function (root) {
  const PROVIDERS = {
    claude: { name: "Claude", model: "claude-sonnet-5-5", keyUrl: "https://console.anthropic.com/settings/keys" },
    gemini: { name: "Gemini", model: "gemini-3.5-flash", keyUrl: "https://aistudio.google.com/apikey" },
    grok: { name: "Grok", model: "grok-4.7", keyUrl: "https://console.x.ai" },
  };
  const ORDER = ["claude", "gemini", "grok"];

  class AIError extends Error {
    constructor(code, message) { super(message); this.code = code; }
  }

  function friendly(status, body) {
    if (status === 401 || status === 403) return new AIError("key", "Clé refusée (vérifie la clé dans Réglages IA).");
    if (status === 429) return new AIError("limit", "Limite atteinte pour cette IA.");
    if (status === 402) return new AIError("limit", "Plus de crédit sur ce compte.");
    if (status === 404) return new AIError("model", "Modèle introuvable (change le nom du modèle dans Réglages IA).");
    if (status >= 500) return new AIError("down", "Le service de cette IA ne répond pas pour l'instant.");
    return new AIError("other", "Erreur " + status + " : " + String(body || "").slice(0, 160));
  }

  async function blobToB64(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = "";
    for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s);
  }

  async function post(url, headers, body, signal) {
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: Object.assign({ "content-type": "application/json" }, headers), body: JSON.stringify(body), signal });
    } catch (e) {
      throw new AIError("network", "Impossible de joindre cette IA (Internet coupé, ou elle refuse les appels depuis une app web).");
    }
    const text = await res.text();
    if (!res.ok) throw friendly(res.status, text);
    try { return JSON.parse(text); } catch (e) { throw new AIError("other", "Réponse illisible."); }
  }

  // ---- Claude (Anthropic Messages API) ----
  async function callClaude(cfg, prompt, opt) {
    const content = [];
    for (const img of opt.images || []) content.push({ type: "image", source: { type: "base64", media_type: img.type || "image/jpeg", data: await blobToB64(img) } });
    content.push({ type: "text", text: prompt });
    const body = { model: cfg.model || PROVIDERS.claude.model, max_tokens: opt.maxTokens || 8000, messages: [{ role: "user", content }] };
    if (opt.web) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 8 }];
    const data = await post("https://api.anthropic.com/v1/messages",
      { "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body, opt.signal);

  const imageReady = (settings) => ["gemini", "grok"].filter((p) => settings.keys && settings.keys[p]);

    const avail = imageReady(settings);
    if (!avail.length) throw new AIError("nokey", "Il faut une clé Gemini ou Grok pour les photos.");
    const pref = settings.photoBy && avail.includes(settings.photoBy) ? settings.photoBy : avail.includes(settings.main) ? settings.main : avail[0];
    const order = [pref].concat(settings.auto === false ? [] : avail.filter((p) => p !== pref));
    const errors = [];
    for (const p of order) {

      catch (e) { if (e.name === "AbortError") throw e; errors.push(PROVIDERS[p].name + " : " + e.message); }

  }

  // settings: {main: "gemini", auto: true, keys: {claude, gemini, grok}, models: {...}}
  function ready(settings) { return ORDER.filter((p) => settings.keys && settings.keys[p]); }

  // Ask the chosen AI; on failure, try the others that have a key (if allowed). Returns {text, by}.

  }

  root.AI = { PROVIDERS, ORDER, ask, ready, extractJSON, AIError, image, imageReady, IMG_MODELS };
})(typeof window !== "undefined" ? window : globalThis);

<script>
// Real recipe photos: made once by the chosen AI, shrunk to JPEG and kept on this device (IndexedDB).
(function (root) {
  const DBN = "panierfute-photos", ST = "photos";
  const urls = {}; // recipe id -> object URL
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(ST);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(ST, mode); const out = fn(t.objectStore(ST)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  async function loadAll() {
    try {
      const db = await open();
      await new Promise((res) => {
        const c = db.transaction(ST).objectStore(ST).openCursor();
        c.onsuccess = () => { const cur = c.result; if (!cur) return res(); urls[cur.key] = URL.createObjectURL(cur.value); cur.continue(); };
        c.onerror = () => res();
      });
    } catch (e) {}
    return Object.keys(urls).length;
  }
  // Shrink to 800x500 JPEG so 300 photos stay small (~60-90 KB each)
  async function shrink(blob) {
    try {
      const bmp = await createImageBitmap(blob);
      const W = 800, H = 500, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d"), s = Math.max(W / bmp.width, H / bmp.height);
      g.drawImage(bmp, (W - bmp.width * s) / 2, (H - bmp.height * s) / 2, bmp.width * s, bmp.height * s);
      return await new Promise((r) => c.toBlob((b) => r(b || blob), "image/jpeg", 0.82));
    } catch (e) { return blob; }
  }
  async function put(id, blob) {
    const small = await shrink(blob);
    try { await tx("readwrite", (s) => s.put(small, id)); } catch (e) {}
    if (urls[id]) URL.revokeObjectURL(urls[id]);
    urls[id] = URL.createObjectURL(small);
    return urls[id];
  }
  async function del(id) { try { await tx("readwrite", (s) => s.delete(id)); } catch (e) {} if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; } }
  async function clear() { try { await tx("readwrite", (s) => s.clear()); } catch (e) {} for (const k in urls) { URL.revokeObjectURL(urls[k]); delete urls[k]; } }
  root.Photos = { loadAll, put, del, clear, url: (id) => urls[id] || null, count: () => Object.keys(urls).length };
})(typeof window !== "undefined" ? window : globalThis);

<script>
// Free phone <-> computer sync through a private GitHub Gist.
// Only the shared app data travels (menu, ticked list, tastes, AI recipes, specials, settings).
// AI keys, photos and per-device view state never leave the device.
(function (root) {
  const API = "https://api.github.com";
  const FILE = "panierfute.json";
  const KEY = "panierfute.sync";
  let cfg = { token: "", gist: "", last: "" };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const saveCfg = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };

  async function gh(path, opt = {}) {
    let res;
    try {
      res = await fetch(API + path, Object.assign({}, opt, { headers: Object.assign({ authorization: "Bearer " + cfg.token, accept: "application/vnd.github+json", "content-type": "application/json" }, opt.headers || {}) }));
    } catch (e) { throw new Error("pas d'Internet"); }
    if (res.status === 401) throw new Error("clé GitHub refusée");
    if (res.status === 403 || res.status === 404) throw new Error("la clé GitHub n'a pas la permission « gist »");
    if (!res.ok) throw new Error("GitHub erreur " + res.status);
    return res.json();
  }

  // Find the app's gist (so the second device needs only the key), or create it
  async function connect(token, initialData) {
    cfg.token = token.trim();
    let found = null;
    for (let page = 1; page <= 5 && !found; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      found = list.find((g) => g.files && g.files[FILE]);
      if (list.length < 100) break;
    }
    if (found) cfg.gist = found.id;
    else {
      const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Panier futé - synchro (ne pas effacer)", public: false, files: { [FILE]: { content: JSON.stringify(initialData) } } }) });
      cfg.gist = g.id;
    }
    saveCfg();
    return !!found;
  }

  async function pull() {
    const g = await gh("/gists/" + cfg.gist);
    const f = g.files && g.files[FILE];
    if (!f) return null;
    let text = f.content;
    if (f.truncated && f.raw_url) { const r = await fetch(f.raw_url); text = await r.text(); }
    try { return JSON.parse(text); } catch (e) { return null; }
  }
  async function push(data) {
    await gh("/gists/" + cfg.gist, { method: "PATCH", body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(data) } } }) });
    cfg.last = new Date().toISOString(); saveCfg();
  }
  function disconnect() { cfg = { token: "", gist: "", last: "" }; saveCfg(); }

  root.Sync = { connect, pull, push, disconnect, on: () => !!(cfg.token && cfg.gist), last: () => cfg.last };
})(typeof window !== "undefined" ? window : globalThis);

</script>

function autoMenu() {
  let menu = S.menu.slice();
  for (let n = Math.max(menu.length + 1, 5); n <= 8; n++) {
    menu = L.autoPick(menu, ranked().filter((x) => S.aime[x.r.id] !== -1), BYID, n);
    if (!L.planWeek(menu, BYID, mealsOf).empty) break;
  }
  setMenu(menu);
  toast("Menu fait avec les meilleurs spéciaux");
}
function setMenu(m) {
  S.menu = m;
  for (const id of m) if (!S.mes.includes(id)) S.mes.unshift(id);
  save();
}

    return `<article class="rec"><button class="pic" data-open="${r.id}" aria-label="Voir la recette">${pic(r)}</button><button class="nm" data-open="${r.id}">${esc(r.n)}</button>

const photoQ = []; let photoBusy = false, photoPause = 0, photoObs = null;
function wantPhoto(id) {
  if (Photos.url(id) || photoQ.includes(id) || !AI.imageReady(AIS).length || Date.now() < photoPause) return;
  photoQ.push(id); runPhotos();
}
async function runPhotos() {
  if (photoBusy) return;
  photoBusy = true;
  while (photoQ.length && Date.now() >= photoPause) {
    const id = photoQ.shift(), r = BYID[id];
    if (!r || Photos.url(id)) continue;
    try {
      const { blob } = await AI.image(AIS, photoPrompt(r));
      const u = await Photos.put(id, blob);
      document.querySelectorAll(`[data-ph="${CSS.escape(id)}"]`).forEach((el) => (el.innerHTML = `<img src="${u}" alt="Photo : ${esc(r.n)}">`));
      const m = $("#photoMsg"); if (m && S.open === id) m.textContent = "Photo générée par l'IA";
    } catch (e) {
      photoQ.length = 0;
      photoPause = Date.now() + 15 * 6e4;
      toast("Photos en pause 15 min : " + (e.message || "erreur").slice(0, 120));
      const m = $("#photoMsg"); if (m) m.textContent = e.message || "Erreur";
    }
  }
  photoBusy = false;
}
// Ask for photos only for cards actually on screen (saves money)
function hydratePhotos() {
  if (AIS.photos !== "auto" || !AI.imageReady(AIS).length) return;
  if (!photoObs && "IntersectionObserver" in window) photoObs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { photoObs.unobserve(e.target); wantPhoto(e.target.dataset.ph); } }), { rootMargin: "100px" });
  document.querySelectorAll(".view.on [data-ph]").forEach((el) => { if (!el.querySelector("img") && photoObs) photoObs.observe(el); });
}

// ---------- AI: this week's flyers ----------
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function weekKey() { // Quebec flyers run Thursday -> Wednesday: key = date of this week's Thursday
  const d = new Date(today() + "T12:00"); const back = (d.getDay() + 3) % 7; d.setDate(d.getDate() - back); return d.toISOString().slice(0, 10);
}
let majBusy = false;
async function updateFlyers(silent) {
  if (majBusy || !aiOn()) return false;
  majBusy = true;
  const msg = (t) => { if (!silent) { const el = $("#majMsg"); if (el) el.textContent = t; } };
  msg("L'IA lit les circulaires de la semaine…");
  const t = today(), wk = weekKey();
  const ids = Object.entries(ING).map(([k, v]) => `${k} = ${v.n} [${v.u}]`).join("\n");
  const prompt = `Aujourd'hui, nous sommes le ${t}. Cherche sur le web les circulaires d'épicerie du Québec (région de Montréal) EN VIGUEUR CETTE SEMAINE (semaine qui commence le jeudi ${wk}) pour : ${L.STORES.join(", ")}.
Bonnes sources : l'article hebdo de Noovo Moi « circulaires épicerie <dates> », Narcity « rabais épicerie », circulaire-en-ligne.ca, les sites des épiceries. Vérifie bien les DATES : refuse toute circulaire d'une autre semaine. N'invente aucun prix.
Associe chaque produit à un identifiant de cette liste (sinon "ing": null) :
${ids}
Réponds UNIQUEMENT par cet objet JSON :
{"debut":"AAAA-MM-JJ","fin":"AAAA-MM-JJ","source":"Circulaires du ... au ... (sources)","items":[{"ing":"id ou null","mag":"${L.STORES.join('"|"')}","prix":3.99,"qte":1,"unite":"lb|kg|g|ml|L|u","txt":"nom court + format"}]}
Règles : prix au lb → unite "lb", qte 1 ; paquet de 375 g à 3,33 $ → prix 3.33, qte 375, unite "g" ; 4 poireaux à 2,84 $ → prix 2.84, qte 4, unite "u" ; douzaine d'œufs → qte 12, unite "u". Un item par magasin. Vise 25 à 60 spéciaux, surtout viandes, poissons, fruits et légumes, produits laitiers.`;
  try {
    const j = AI.extractJSON(await askAI(prompt, { web: true, maxTokens: 12000 }), "object");
    if (!j || !Array.isArray(j.items)) throw new Error("réponse illisible");
    const days = (new Date(j.fin) - new Date(j.debut)) / 864e5;
    if (!(j.debut <= t && t <= j.fin) || !(days >= 4 && days <= 9)) throw new Error(`ce n'est pas la bonne semaine (${j.debut} au ${j.fin})`);
    const items = j.items.filter((x) => x && L.STORES.includes(x.mag) && Number(x.prix) > 0).map((x) => ({
      ing: ING[x.ing] ? x.ing : null, mag: x.mag, prix: Number(x.prix), qte: Number(x.qte) || 1,
      unite: ["lb", "kg", "g", "ml", "L", "u"].includes(x.unite) ? x.unite : "u", txt: String(x.txt || (ING[x.ing] || {}).n || "").slice(0, 90) }));
    if (items.length < 5) throw new Error("trop peu de spéciaux trouvés");
    SPEC = { debut: j.debut, fin: j.fin, source: String(j.source || "Circulaires de la semaine").slice(0, 160) + " · lu par " + AI.PROVIDERS[AIS.last].name, items };
    S.spec = SPEC; S.majTry = ""; rankCache = null; save();
    render(S.view);
    msg(`✓ ${items.length} spéciaux du ${frDate(j.debut)} au ${frDate(j.fin)} (${AI.PROVIDERS[AIS.last].name}).`);
    if (silent) toast(`Circulaires à jour : ${items.length} spéciaux (${AI.PROVIDERS[AIS.last].name})`);
    return true;
  } catch (e) {
    S.majTry = new Date().toISOString(); save();
    msg("Mise à jour impossible : " + (e.message || e) + ". Réessaie plus tard ou ajoute les spéciaux toi-même.");
    return false;
  } finally { majBusy = false; }
}
// Runs by itself when the app opens: new week -> new flyers, then 4 new recipes for our tastes
async function weeklyAuto() {
  if (!aiOn() || AIS.autoMaj === false) return;
  const t = today();
  const recentTry = S.majTry && Date.now() - new Date(S.majTry).getTime() < 6 * 36e5;

    S.ajust[ajKey(id)] = { q, conseils: (Array.isArray(j.conseils) ? j.conseils : []).map(String).slice(0, 5) };
    save(); openRec(id); render(S.view);
  } catch (e) { const m2 = $("#adjMsg"); if (m2) m2.textContent = "Ça n'a pas marché" + (e && e.message ? " : " + e.message : ", réessaie."); }
}

// ---------- events ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-go]");
  if (!t) { if (e.target.id === "sheet") closeRec(); return; }
  const d = t.dataset;
  if (d.v) return show(d.v, false);
  if (d.open) return openRec(d.open);
  if (d.tg) return toggleMenu(d.tg);
  if (d.ck) { S.coches[d.ck] = !S.coches[d.ck]; if (!S.coches[d.ck]) delete S.coches[d.ck]; save(); return rList(), updateBadge(); }
  if (d.rm) { S.menu = S.menu.filter((x) => x !== d.rm); save(); return rMenu(); }
  if (d.rf) { S.rf = d.rf; recLimit = 40; save(); return rRec(); }
  if (d.ing) { S.rf = "spec"; S.q = ING[d.ing].n.split(" (")[0]; S.cat = ""; return show("recettes", false); }
  if (d.del) { S.extra = S.extra.filter((x) => x.perso !== d.del); rankCache = null; save(); return rSpec(); }
  if (d.go === "menu-auto") { autoMenu(); return show("menu", false); }
  if (d.go === "menu-clear") { S.menu = []; save(); return rMenu(); }
  if (d.go) return show(d.go, false);
  if (t.id === "closeSheet") return closeRec();
  if (d.like && S.open) { const v = Number(d.like); if (S.aime[S.open] === v) delete S.aime[S.open]; else S.aime[S.open] = v; rankCache = null; save(); savePrefs(); openRec(S.open); return render(S.view); }
  if (t.id === "iaGen") return iaGenerate();
  if (t.id === "majNow") return updateFlyers(false);
  if (d.test) {
    const p = d.test, out = $("#test-" + p);
    out.textContent = "Test…";
    const one = { main: p, auto: false, keys: { [p]: AIS.keys[p] }, models: AIS.models };
    AI.ask(one, "Réponds seulement : OK").then(() => (out.textContent = "✓ Fonctionne"), (e) => (out.textContent = "✗ " + e.message.replace(/^.*? : /, "")));
    return;
  }
  if (t.id === "syncOn") {
    const tok = $("#syncTok").value.trim();
    if (!tok) return toast("Colle d'abord ta clé GitHub");
    $("#syncState").textContent = "Connexion…";
    Sync.connect(tok, shared()).then(async (found) => {
      if (found) { S.t = 0; } // second device: take what the first one saved
      await syncNow();
      toast(found ? "Synchro active : données reçues de l'autre appareil" : "Synchro créée : fais la même chose sur l'autre appareil");
      rReg();
    }, (e) => { Sync.disconnect(); $("#syncState").textContent = "Impossible : " + e.message; });
    return;
  }
  if (t.id === "syncGo") return syncNow(true);
  if (t.id === "syncOff") { Sync.disconnect(); syncState = ""; toast("Synchro arrêtée sur cet appareil"); return rReg(); }
  if (t.id === "expBtn") {
    const data = JSON.stringify(Object.assign({}, S, { open: null, scroll: {} }));
    navigator.clipboard.writeText(data).then(() => toast("Données copiées : colle-les dans l'autre appareil"), () => { $("#impTxt").value = data; toast("Copie impossible : sélectionne le texte et copie-le"); });
    return;
  }
  if (t.id === "impBtn") {
    try { const j = JSON.parse($("#impTxt").value); if (!j || !Array.isArray(j.menu)) throw 0;
      S = Object.assign(fresh(), j, { reg: Object.assign(fresh().reg, j.reg || {}) }); addIA(S.ia || []); if (S.spec && (!SPEC || S.spec.debut >= SPEC.debut)) SPEC = S.spec;
      rankCache = null; save(); toast("Données importées"); show("menu", false);
    } catch (e) { toast("Ce texte n'est pas valide"); }
    return;
  }
  if (t.id === "iaAdj" && S.open) return iaAdjust(S.open);
  if (t.id === "adjOff" && S.open) { delete S.ajust[ajKey(S.open)]; save(); openRec(S.open); return render(S.view); }
  if (t.id === "more") { recLimit += 60; rRec(); return setTimeout(hydratePhotos, 50); }
  if (t.id === "photoNew" && S.open) { const id = S.open; photoPause = 0; $("#photoMsg").textContent = "Photo en cours…"; Photos.del(id).then(() => { photoQ.unshift(id); runPhotos(); }); return; }
  if (t.id === "photoClear") { Photos.clear().then(() => { toast("Photos effacées"); rReg(); }); return; }
  if (t.id === "uncheck") { S.coches = {}; save(); rList(); return updateBadge(); }
  if (t.id === "pasteBtn") { $("#pasteBox").hidden = !$("#pasteBox").hidden; return; }
  if (t.id === "pasteGo") { const v = $("#pasteTxt").value.trim(); if (v) readSpecials(v, null); return; }
  if (t.id === "copyList") {
    const { list, ch } = listData();
    const txt = ch.stores.map((s) => s.toUpperCase() + "\n" + list.filter((it) => !S.coches[it.id] && ch.assign[it.id].mag === s).map((it) => "- " + ING[it.id].n + " : " + L.fmtQty(ING[it.id], it.buy)).join("\n")).join("\n\n");
    navigator.clipboard.writeText(txt).then(() => toast("Liste copiée"), () => toast("Copie impossible ici"));
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.store) {
    const s = t.dataset.store;
    S.reg.stores = t.checked ? [...new Set(S.reg.stores.concat(s))] : S.reg.stores.filter((x) => x !== s);
    S.reg.stores = L.STORES.filter((x) => S.reg.stores.includes(x));
    rankCache = null; save(); return rReg();
  }
  if (t.dataset.cfg && S.open) {
    S.cfg[S.open] = Object.assign(cfgOf(S.open), { [t.dataset.cfg]: Number(t.value) });
    rankCache = null; save(); openRec(S.open); return render(S.view);
  }
  if (t.id === "dPers" || t.id === "dJours" || t.id === "dRpj") { S.reg[{ dPers: "pers", dJours: "jours", dRpj: "rpj" }[t.id]] = Number(t.value); rankCache = null; save(); return; }
  if (t.id === "gouts") { S.gouts = t.value.slice(0, 1500); save(); savePrefs(); return; }
  if (t.dataset.key) { AIS.keys[t.dataset.key] = t.value.trim(); saveAI(); updateAIBadge(); return rReg(); }
  if (t.dataset.model) { AIS.models[t.dataset.model] = t.value.trim(); saveAI(); return; }
  if (t.id === "aiMain") { AIS.main = t.value; saveAI(); updateAIBadge(); return; }
  if (t.id === "aiAuto") { AIS.auto = t.checked; saveAI(); return; }
  if (t.id === "aiPhotos") { AIS.photos = t.value; saveAI(); return; }
  if (t.id === "aiPhotoBy") { AIS.photoBy = t.value; saveAI(); return; }
  if (t.id === "aiMaj") { AIS.autoMaj = t.checked; saveAI(); return; }
  if (t.id === "rHome") S.reg.home = t.value;
  else if (t.id === "rPen") S.reg.pen = Math.max(0, Number(t.value) || 0);
  else if (t.id === "rMax") S.reg.max = Number(t.value);
  else if (t.id === "rDeb") S.reg.debut = Number(t.value);
  else if (t.id === "cat") { S.cat = t.value; recLimit = 40; save(); return rRec(); }
  else if (t.id === "photo" && t.files && t.files[0]) return readSpecials(null, t.files[0]);
  else return;
  save();
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value; recLimit = 40; save(); const pos = e.target.selectionStart; rRec(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); }, 250);
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const un = $("#fUn").value;
  S.extra.push({ ing: $("#fIng").value, mag: $("#fMag").value, prix: Number($("#fPrix").value), qte: un === "lb" || un === "kg" ? 1 : Number($("#fQte").value) || 1, unite: un,
    txt: ING[$("#fIng").value].n, perso: "p" + Date.now(), fin: new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10) });
  rankCache = null; save(); rSpec(); toast("Spécial ajouté");
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open) closeRec(); });
let scTimer;
window.addEventListener("scroll", () => { clearTimeout(scTimer); scTimer = setTimeout(() => { S.scroll[S.view] = window.scrollY; save(false); }, 400); }, { passive: true });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) show(v); });

// ---------- start ----------
function start() {
  $("#loading").remove();
  const h = location.hash.slice(1);
  show(VIEWS.includes(h) ? h : S.view);
  started = true;
  if (S.open) openRec(S.open);
}
const getJSON = (name, inline) => (inline ? Promise.resolve(inline) : fetch(name).then((r) => r.json()));
Promise.all([getJSON("recettes.json", window.DATA_RECETTES), getJSON("speciaux.json", window.DATA_SPECIAUX).catch(() => null)])
  .then(([d, sp]) => {
    DATA = d; ING = d.ing; REC = d.rec; BYID = Object.fromEntries(REC.map((r) => [r.id, r]));
    if (sp && (!SPEC || sp.debut > SPEC.debut)) SPEC = sp;
    if (S.spec && S.spec.items && (!SPEC || S.spec.debut >= SPEC.debut)) SPEC = S.spec;
    addIA(S.ia || []);

    S.menu = S.menu.filter((id) => BYID[id]); S.mes = S.mes.filter((id) => BYID[id]);
    start();
    Photos.loadAll().then((n) => { if (n) { render(S.view); if (S.open) openRec(S.open); } });
    setTimeout(async () => { await syncNow(); weeklyAuto(); }, 800);
  })
  .catch(() => { $("#loading").textContent = "Impossible de charger les recettes. Recharge la page."; });

// Standalone start: offline cache when served from a web address, then weekly background update
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
updateAIBadge();
}

</script>
</body>
</html>
