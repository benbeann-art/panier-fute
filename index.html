    S.cfg[S.open] = Object.assign(cfgOf(S.open), { [t.dataset.cfg]: Number(t.value) });
    rankCache = null; save(); openRec(S.open); return render(S.view);
  }
  if (t.id === "dPers" || t.id === "dJours" || t.id === "dRpj") { S.reg[{ dPers: "pers", dJours: "jours", dRpj: "rpj" }[t.id]] = Number(t.value); rankCache = null; save(); return; }
  if (t.id === "gouts") { S.gouts = t.value.slice(0, 1500); save(); savePrefs(); return; }
  if (t.dataset.key) { AIS.keys[t.dataset.key] = t.value.trim(); saveAI(); updateAIBadge(); return rReg(); }
  if (t.dataset.model) { AIS.models[t.dataset.model] = t.value.trim(); saveAI(); return; }
  if (t.id === "aiMain") { AIS.main = t.value; saveAI(); updateAIBadge(); return; }
  if (t.id === "aiAuto") { AIS.auto = t.checked; saveAI(); return; }
  if (t.dataset.xp !== undefined) { const ex = S.extras[Number(t.dataset.xp)]; if (ex) { ex.p = Math.max(0, Number(t.value) || 0); ensureCustom(ex); rankCache = null; save(); rList(); } return; }
  if (t.id === "awake") { keepAwake(t.checked); toast(t.checked ? "L'écran restera allumé" : "Écran normal"); return; }
  if (t.id === "invPhoto" && t.files && t.files.length) return readFridgePhotos([...t.files].slice(0, 6), S.invTab || "frigo");
  if (t.id === "rcPhoto" && t.files && t.files.length) return readReceipt([...t.files].slice(0, 3));
  if (t.dataset.invexp !== undefined) { const x = zoneList(S.invTab || "frigo")[Number(t.dataset.invexp)]; if (x) { x.exp = t.value; save(); rHome(); } return; }
  if (t.dataset.rvk !== undefined && invReview) { invReview[Number(t.dataset.rvk)].keep = t.checked; return; }
  if (t.dataset.rvz !== undefined && invReview) { invReview[Number(t.dataset.rvz)].zone = t.value; return; }
  if (t.id === "spicesHome") { S.spicesHome = t.checked; rankCache = null; save(); return rHome(); }
  if (t.dataset.ckp !== undefined && cook) { cook.done[t.dataset.ckp] = t.checked; return; }
  if (t.dataset.ban !== undefined) { const b = t.dataset.ban; S.reg.ban = t.checked ? [...new Set((S.reg.ban || []).concat(b))] : (S.reg.ban || []).filter((x) => x !== b); S.menu = S.menu.filter((id) => !BYID[id] || !isBanned(BYID[id])); rankCache = null; save(); return; }
  if (t.id === "sumMonth") { sumMonth = t.value; const sb = $("#sumHost"); if (sb) sb.innerHTML = summaryBox(); return; }
  if (t.id === "budget") { S.reg.budget = Math.max(0, Number(t.value) || 0); save(); return; }
  if (t.id === "regAuto") { AIS.regAuto = t.checked; saveAI(); return; }
  if (t.id === "histAuto") { AIS.histAuto = t.checked; saveAI(); return; }
  if (t.id === "aiPhotos") { AIS.photos = t.value; saveAI(); return; }
  if (t.id === "aiPhotoBy") { AIS.photoBy = t.value; saveAI(); return; }
  if (t.id === "aiMaj") { AIS.autoMaj = t.checked; saveAI(); return; }
  if (t.id === "rHome") S.reg.home = t.value;
  else if (t.id === "rPen") S.reg.pen = Math.max(0, Number(t.value) || 0);
  else if (t.id === "rMax") S.reg.max = Number(t.value);
  else if (t.id === "rDeb") S.reg.debut = Number(t.value);
  else if (t.id === "cat") { S.cat = t.value; recLimit = 40; save(); return rRec(); }
  else if (t.id === "photo" && t.files && t.files[0]) return readSpecials(null, t.files[0]);
  else return;
  save();
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.id === "addTxt") return renderSugg();
  if (e.target.id !== "q") return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value; recLimit = 40; save(); const pos = e.target.selectionStart; rRec(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); }, 250);
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "invForm") { e.preventDefault(); const v = $("#invTxt").value.trim(); if (!v) return; const id = guessIng(v);
    addInv(S.invTab || "frigo", { n: id ? ING[id].n.split(" (")[0] : v.charAt(0).toUpperCase() + v.slice(1), id, qte: "" }); rankCache = null; save(); toast(id ? `Ajouté : ${ING[id].n.split(" (")[0]}` : `Ajouté : ${v}`); return rHome(); }
  if (e.target.id === "frzForm") { e.preventDefault(); const n = $("#frzName").value.trim(); if (n) { toFreezer(n, Number($("#frzPor").value) || 4); render(S.view); } return; }
  if (e.target.id === "askForm") { e.preventDefault(); return iaAsk($("#askTxt").value); }
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const un = $("#fUn").value;
  S.extra.push({ ing: $("#fIng").value, mag: $("#fMag").value, prix: Number($("#fPrix").value), qte: un === "lb" || un === "kg" ? 1 : Number($("#fQte").value) || 1, unite: un,
    txt: ING[$("#fIng").value].n, perso: "p" + Date.now(), fin: new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10) });
  recordWeek({ debut: weekKey(), items: [S.extra[S.extra.length - 1]] });
  rankCache = null; save(); rSpec(); toast("Spécial ajouté");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "addTxt") { e.preventDefault(); const f = document.querySelector("#sugg .sug[data-addk]") || document.querySelector("#sugg .sug[data-addai]") || document.querySelector("#sugg .sug"); if (f) f.click(); return; } if (e.key === "Escape" && shop) return closeShop(); if (e.key === "Escape" && cook) return closeCook(); if (e.key === "Escape" && S.open) closeRec(); });
let scTimer;
window.addEventListener("scroll", () => { clearTimeout(scTimer); scTimer = setTimeout(() => { S.scroll[S.view] = window.scrollY; save(false); }, 400); }, { passive: true });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) show(v); });

// ---------- start ----------
function start() {
  $("#loading").remove();
  const h = location.hash.slice(1);
  show(VIEWS.includes(h) ? h : S.view);
  started = true;
  if (S.open) openRec(S.open);
}
const getJSON = (name, inline) => (inline ? Promise.resolve(inline) : fetch(name).then((r) => r.json()));
Promise.all([getJSON("recettes.json", window.DATA_RECETTES), getJSON("speciaux.json", window.DATA_SPECIAUX).catch(() => null)])
  .then(([d, sp]) => {
    DATA = d; ING = d.ing; REC = d.rec; BYID = Object.fromEntries(REC.map((r) => [r.id, r]));
    if (sp && (!SPEC || sp.debut > SPEC.debut)) SPEC = sp;
    if (S.spec && S.spec.items && (!SPEC || S.spec.debut >= SPEC.debut)) SPEC = S.spec;
    initCatalog();
    applyRegPrices();
    L.setHistory(S.hist); recordWeek(SPEC);
    addIA(S.ia || []);

    S.menu = S.menu.filter((id) => BYID[id]); S.mes = S.mes.filter((id) => BYID[id]);
    start();
    Photos.loadAll().then((n) => { if (n) { render(S.view); if (S.open) openRec(S.open); } });
    setTimeout(async () => { await syncNow(); weeklyAuto(); }, 800);
  })
  .catch(() => { $("#loading").textContent = "Impossible de charger les recettes. Recharge la page."; });

// Standalone start: offline cache when served from a web address, then weekly background update
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
updateAIBadge();
renderTimers();
}

</script>
